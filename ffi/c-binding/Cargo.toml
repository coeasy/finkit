[package]
name = "finkit-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "C FFI bindings for Finkit"

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]
path = "src/root.rs"

[dependencies]
finkit = { path = "../../core", default-features = false, features = ["std", "serde", "formula", "indicators-all"] }
finkit-ffi-common = { path = "../ffi-common" }
libc = "0.2"
serde_json = { workspace = true }
ndarray = { workspace = true }
