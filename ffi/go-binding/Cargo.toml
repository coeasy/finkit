[package]
name = "finkit-go"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Go bindings for finkit via CGO"
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]
path = "src/lib.rs"

[dependencies]
finkit = { path = "../../core", default-features = false, features = ["std", "serde", "formula", "indicators-all"] }
ndarray = { workspace = true }
libc = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
finkit-ffi-common = { path = "../ffi-common" }