[package]
name = "finkit-ios"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "iOS bindings for Finkit — built as a staticlib + .modulemap and packaged as an .xcframework"

[lints]
workspace = true

[lib]
# `staticlib` is the only way to ship a Rust crate inside an .xcframework:
# Apple requires the dylib to be marked optional and embedded as a private
# framework, which adds MB of overhead; `staticlib` + a Swift wrapper
# module is the conventional, low-overhead way.
crate-type = ["staticlib"]

[dependencies]
# The current Swift/C surface is indicator-only. Avoid carrying the core's
# formula/JIT/metrics/tracing default features into each Apple target until
# those APIs are intentionally exposed by the iOS binding.
finkit = { path = "../../core", default-features = false, features = ["indicators-all"] }
libc = "0.2"
ndarray = { workspace = true }
finkit-ffi-common = { path = "../ffi-common" }
