[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "finkit"
version = "0.2.0"
description = "Rust-powered quantitative finance engine for indicators, formulas, factors, streaming analytics, and research workflows"
authors = [
    {name = "Finkit Contributors"}
]
maintainers = [
    {name = "Finkit Team"}
]
readme = "README.md"
license = {text = "MIT OR Apache-2.0"}
keywords = [
    "quantitative-finance",
    "technical-analysis",
    "factor-research",
    "streaming",
    "financial-data",
    "indicators",
    "formula-engine",
    "rust",
    "numpy",
    "performance"
]
dependencies = [
    "numpy>=1.24",
]
optional-dependencies = { pandas = ["pandas>=1.5"], dev = ["maturin>=1.5,<2.0", "numpy>=1.24", "pandas>=1.5", "pytest>=8"] }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Operating System :: OS Independent",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.8,<3.15"

[project.urls]
Homepage = "https://github.com/coeasy/finkit"
Documentation = "https://github.com/coeasy/finkit/tree/main/docs/README.md"
Repository = "https://github.com/coeasy/finkit"
Issues = "https://github.com/coeasy/finkit/issues"
Changelog = "https://github.com/coeasy/finkit/releases"

[tool.maturin]
features = ["pyo3/extension-module", "abi3"]
module-name = "finkit.finkit"
python-source = "."
python-packages = ["finkit"]
strip = true
sdist-include = ["Cargo.lock"]
include = ["finkit/py.typed"]

# No `[tool.maturin.target.<triple>]` blocks: every platform previously
# repeated the global `features` list verbatim (6 copies — a DRY violation
# where one edit could silently miss the others). Maturin applies the global
# `[tool.maturin]` configuration to every target unless a per-target block
# overrides it, so the global block alone is the single source of truth. If a
# platform ever genuinely needs different features, reintroduce exactly that
# one block and record why.
