[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "finkit"
version = "0.1.0"
description = "High-performance financial technical analysis library for quantitative trading"
authors = [
    {name = "Finkit Contributors"}
]
maintainers = [
    {name = "Finkit Team"}
]
readme = "README.md"
license = {text = "MIT OR Apache-2.0"}
keywords = [
    "technical-analysis",
    "trading",
    "quantitative",
    "finance",
    "finkit",
    "stock",
    "crypto",
    "indicators",
    "rust",
    "performance"
]
dependencies = [
    "numpy>=1.24",
]
optional-dependencies = { pandas = ["pandas>=1.5"], dev = ["maturin>=1.5,<2.0", "numpy>=1.24", "pandas>=1.5", "pytest>=8"] }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Operating System :: OS Independent",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.8,<3.15"

[project.urls]
Homepage = "https://github.com/coeasy/finkit"
Documentation = "https://github.com/coeasy/finkit/tree/main/docs/python.md"
Repository = "https://github.com/coeasy/finkit"
Issues = "https://github.com/coeasy/finkit/issues"
Changelog = "https://github.com/coeasy/finkit/releases"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "finkit.finkit"
python-source = "."
python-packages = ["finkit"]
strip = true
sdist-include = ["Cargo.lock"]
include = ["finkit/py.typed"]

[tool.maturin.target.x86_64-pc-windows-msvc]
features = ["pyo3/extension-module"]

[tool.maturin.target.i686-pc-windows-msvc]
features = ["pyo3/extension-module"]

[tool.maturin.target.x86_64-unknown-linux-gnu]
features = ["pyo3/extension-module"]

[tool.maturin.target.aarch64-unknown-linux-gnu]
features = ["pyo3/extension-module"]

[tool.maturin.target.x86_64-apple-darwin]
features = ["pyo3/extension-module"]

[tool.maturin.target.aarch64-apple-darwin]
features = ["pyo3/extension-module"]
