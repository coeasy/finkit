[package]
name = "finkit-android"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Android (JNI) bindings for finkit — built as a cdylib loaded from a .aar"

[lints]
workspace = true

[lib]
# `cdylib` is required so the .so is callable from the JVM via JNI.
crate-type = ["cdylib"]

[dependencies]
# The Android Java API currently exposes indicators only. Keep the mobile
# native library on the smallest core feature set that implements that public
# surface instead of pulling formula/JIT/metrics/tracing into every ABI.
finkit = { path = "../../core", default-features = false, features = ["indicators-all"] }

jni = { workspace = true }
ndarray = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
# The Android NDK ships its own log.h; jni-sys pulls in the right C headers.
android_logger = "0.14"
