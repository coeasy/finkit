# ----------------------------------------------------------------------------
# Finkit Android AAR build (Gradle).
#
# Build the .so for all 4 ABIs (arm64-v8a, armeabi-v7a, x86_64, x86), then
# run `./gradlew :aar` to assemble a single .aar containing all of them.
#
# Required environment:
#   ANDROID_NDK_HOME   (NDK 25 or later; supports cargo integration)
#   ANDROID_HOME       (Android SDK root)
#
# Required NDK toolchains (installed via `sdkmanager`):
#   * aarch64-linux-android24-clang
#   * armv7a-linux-androideabi24-clang
#   * x86_64-linux-android24-clang
#   * i686-linux-android24-clang
# ----------------------------------------------------------------------------

android:
    ndk:
        version: "25.2.9519653"
        abiFilters: ["arm64-v8a", "armeabi-v7a", "x86_64", "x86"]

plugins:
    - id: "com.android.library"
    - id: "org.jetbrains.kotlin.android"
    - id: "org.mozilla.rust-android-gradle.rust-android"

android.library:
    namespace: "com.finkit.indicators"
    compileSdk: 34
    defaultConfig:
        minSdk: 24

    sourceSets:
        main:
            manifest: "src/main/AndroidManifest.xml"
            java.srcDirs: ["src/main/java"]

# cargo configuration: build the `finkit-android` crate for all 4 ABIs
cargo:
    module: "../"
    targets:
        - "aarch64-linux-android24"
        - "armv7-linux-androideabi24"
        - "x86_64-linux-android24"
        - "i686-linux-android24"
    profile: "release"
    libname: "finkit_android"