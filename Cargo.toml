[workspace]
members = [
    "core",
    "visualization",
    "ffi/c-binding",
    "ffi/ffi-common",
    "ffi/python-binding",
    "ffi/node-binding",
    "ffi/go-binding",
    "ffi/dotnet-binding",
    "ffi/ios-binding",
    "ffi/java-binding",
    "ffi/android-binding",
    "cli",
    "wasm",
]
exclude = []
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75" # MSRV 1.75 (workspace-wide)
authors = ["Finkit Contributors"]
description = "A high-performance financial indicator, factor, and formula computation engine in Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/coeasy/finkit"
homepage = "https://github.com/coeasy/finkit"
documentation = "https://docs.rs/alpha-ta-core"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ndarray = "0.16"
thiserror = "1.0"
# JNI bindings (used by java-binding and android-binding).
jni = "0.21"
# Observability ecosystem.
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
metrics = "0.23"
metrics-exporter-prometheus = { version = "0.15", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.release.package."alpha-ta-dotnet"]
codegen-units = 16

[profile.release.package."alpha-ta-go"]
codegen-units = 16

# alpha-ta-java uses default release profile (codegen-units=1) for maximum optimization.

[profile.release.package."alpha-ta-node"]
codegen-units = 16

[profile.release.package."alpha-ta-python"]
codegen-units = 16

[profile.release.package."alpha-ta-ffi"]
codegen-units = 16

[profile.dev]
opt-level = 1
debug = 1

[profile.bench]
inherits = "release"
# Keep aggressive benchmark optimization for representative throughput results.
lto = "fat"
codegen-units = 1
opt-level = 3

[profile.bench.package."*"]
# FFI binding crates favor faster benchmark builds.
codegen-units = 16

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
