[workspace]
members = [
    "core",
    "crates/finkit-array",
    "crates/finkit-series",
    "crates/finkit-factor",
    "crates/finkit-runtime",
    "visualization",
    "ffi/c-binding",
    "ffi/ffi-common",
    "ffi/python-binding",
    "ffi/node-binding",
    "ffi/go-binding",
    "ffi/dotnet-binding",
    "ffi/ios-binding",
    "ffi/java-binding",
    "ffi/android-binding",
    "cli",
    "wasm",
]
exclude = []
resolver = "2"

[workspace.package]
version = "0.1.5"
edition = "2021"
rust-version = "1.85"
authors = ["Finkit Contributors"]
description = "A high-performance Quant Factor Computing Engine in Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/coeasy/finkit"
homepage = "https://github.com/coeasy/finkit"
documentation = "https://docs.rs/finkit"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ndarray = "0.16"
thiserror = "1.0"
jni = "0.21"
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
metrics = "0.23"
metrics-exporter-prometheus = { version = "0.15", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
opt-level = 1
debug = 1

[profile.bench]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = 3

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
