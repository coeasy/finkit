# =============================================================================
# Finkit — one-line docker-compose stack
# =============================================================================
#
# Two services:
#   finkit-builder  — full 7-language build, mounts ./dist to host.
#   bench-vs-talib  — runs only the TA-Lib C head-to-head bench.
#
# Usage:
#   docker compose build                 # build the image
#   docker compose run --rm finkit-builder
#   docker compose run --rm bench-vs-talib
#   docker compose up --abort-on-container-exit   # CI mode
# =============================================================================

services:
  finkit-builder:
    build:
      context: .
      dockerfile: Dockerfile
    image: finkit/builder:latest
    container_name: finkit-builder
    volumes:
      - ./dist:/work/dist
    environment:
      - CARGO_TERM_COLOR=always
    command: ["--no-bundle"]
    # Drop capabilities, run as non-root where possible
    security_opt:
      - no-new-privileges:true

  bench-vs-talib:
    image: finkit/builder:latest
    container_name: finkit-bench-vs-talib
    volumes:
      - ./dist:/work/dist
    environment:
      - CARGO_TERM_COLOR=always
    command: ["--bench-talib"]
    security_opt:
      - no-new-privileges:true
    profiles: ["bench"]
