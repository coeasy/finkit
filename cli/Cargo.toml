[package]
name = "alpha-ta-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line interface for the Finkit financial computation engine"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[[bin]]
name = "finkit"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
alpha-ta-core = { path = "../core", features = ["formula"] }
alpha-ta-visualization = { path = "../visualization" }
clap = { version = "4", features = ["derive"] }
csv = "1.3"
serde = { workspace = true }
serde_json = { workspace = true }
ndarray = { workspace = true }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
