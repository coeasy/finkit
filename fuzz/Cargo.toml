[package]
name = "alpha-ta-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

# The fuzz workspace is intentionally **not** part of the main cargo workspace
# because it requires nightly Rust and the `cargo-fuzz` tooling. To run:
#
#   cargo install cargo-fuzz
#   cargo +nightly fuzz run formula -- -runs=50000
#
# See `docs/FUZZING.md` for full instructions and OSS-Fuzz integration.

[dependencies]
alpha-ta-core = { path = "../core", features = ["std", "formula", "tracing", "metrics"] }
libfuzzer-sys = "0.4"
ndarray = "0.15"

[[bin]]
name = "formula"
path = "fuzz_targets/formula.rs"

[[bin]]
name = "indicators"
path = "fuzz_targets/indicators.rs"

[[bin]]
name = "fuzz_formula_parser"
path = "fuzz_targets/fuzz_formula_parser.rs"

[[bin]]
name = "formula_jit"
path = "fuzz_targets/formula_jit.rs"

[[bin]]
name = "formula_simd"
path = "fuzz_targets/formula_simd.rs"

[[bin]]
name = "streaming_indicators"
path = "fuzz_targets/streaming_indicators.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
