[package]
name = "finkit-factor-analysis"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Factor research, Alphalens-compatible analysis, validation, and portfolio research for Finkit"
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
finkit = { path = "../core" }
