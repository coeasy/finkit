name: TA-Lib installed-wheel release gate

on:
  push:
    branches:
      - fix/talib-performance-plan-20260904
  pull_request:
    branches:
      - main
    paths:
      - 'core/**'
      - 'ffi/python-binding/**'
      - 'scripts/benchmark_talib_release_gate.py'
      - '.github/workflows/talib-release-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-wheel-gate:
    # Branch pushes run the expensive benchmark only after the migration job
    # commits the implemented plan. Pull requests and manual runs always run.
    if: github.event_name != 'push' || contains(github.event.head_commit.message, 'implement TA-Lib parity and zero-copy runtime plan')
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install benchmark toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'maturin>=1.7,<2' 'numpy==2.3.3' 'TA-Lib==0.7.1' pytest
      - name: Build current Finkit wheel
        run: |
          mkdir -p dist/wheel
          maturin build --manifest-path ffi/python-binding/Cargo.toml --release --features abi3 --out dist/wheel
          ls -lh dist/wheel
      - name: Install current wheel
        run: python -m pip install --force-reinstall --no-deps dist/wheel/*.whl
      - name: Public Python contract tests
        run: pytest -q ffi/python-binding/tests/test_talib_public_contract.py
      - name: Installed-wheel TA-Lib parity and performance gate
        run: python scripts/benchmark_talib_release_gate.py --gate
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: talib-installed-wheel-release-gate
          path: |
            dist/bench/talib-release-gate.json
            dist/bench/talib-release-gate.md
          if-no-files-found: warn
