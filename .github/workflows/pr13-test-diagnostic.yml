name: PR13 Targeted Repair

on:
  push:
    branches:
      - fix/contract-and-ci-hardening-v012
    paths:
      - .github/workflows/pr13-test-diagnostic.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Apply targeted parser and sandbox repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match in {path}, found {count}")
              target.write_text(text.replace(old, new, 1))

          replace_once(
              "core/src/formula/grammar.pest",
              'program = _{ SOI ~ (param_decl ~ ";")? ~ statement ~ (";" ~ statement)* ~ EOI }',
              'program = _{ SOI ~ (param_decl ~ ";")? ~ statement ~ (";" ~ statement)* ~ ";"? ~ EOI }',
          )

          replace_once(
              "core/src/formula/engine.rs",
              "        if let Some(result) = self.try_execute_simple_formula(&formula.ast, ctx) {\n            return Ok(result);\n        }\n        self.executor.execute(&formula.ast, ctx)",
              "        let sandbox_unlimited = ctx.sandbox.timeout_ms.is_none()\n            && ctx.sandbox.max_recursion_depth.is_none()\n            && ctx.sandbox.max_memory_bytes.is_none();\n        if sandbox_unlimited {\n            if let Some(result) = self.try_execute_simple_formula(&formula.ast, ctx) {\n                return Ok(result);\n            }\n        }\n        self.executor.execute(&formula.ast, ctx)",
          )

          replace_once(
              "core/src/formula/engine.rs",
              "        if self.try_execute_simple_formula_into(&formula.ast, ctx, output) {\n            return Ok(());\n        }\n        self.executor.eval_into(&formula.ast, ctx, output)",
              "        let sandbox_unlimited = ctx.sandbox.timeout_ms.is_none()\n            && ctx.sandbox.max_recursion_depth.is_none()\n            && ctx.sandbox.max_memory_bytes.is_none();\n        if !sandbox_unlimited {\n            let result = self.executor.execute(&formula.ast, ctx)?;\n            output.assign(&result);\n            return Ok(());\n        }\n        if self.try_execute_simple_formula_into(&formula.ast, ctx, output) {\n            return Ok(());\n        }\n        self.executor.eval_into(&formula.ast, ctx, output)",
          )
          PY

      - name: Format
        run: cargo fmt --all

      - name: Verify targeted regressions
        run: |
          cargo test -p finkit --locked formula::dialect_tests::tdx_terminal_parses_assignment_and_cross -- --exact
          cargo test -p finkit --locked formula::sandbox::tests::sandbox_limits_memory_enforced -- --exact
          cargo test -p finkit --locked formula::sandbox::tests -- --nocapture

      - name: Verify full core suite
        id: core
        shell: bash
        run: |
          set +e
          cargo test -p finkit --locked -- --nocapture 2>&1 | tee /tmp/pr13-core.log
          status=${PIPESTATUS[0]}
          tail -n 600 /tmp/pr13-core.log > .ci-pr13-full-test-failures.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Capture remaining core failures
        if: steps.core.outputs.status != '0'
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .ci-pr13-full-test-failures.txt
          git commit -m "chore: capture remaining PR 13 core failures"
          git push
          exit 1

      - name: Verify workspace compile
        if: steps.core.outputs.status == '0'
        run: cargo check --workspace --all-targets --locked

      - name: Commit verified repair and remove diagnostics
        if: steps.core.outputs.status == '0'
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/pr13-test-diagnostic.yml .ci-pr13-test-failures.txt .ci-pr13-full-test-failures.txt
          git add -A
          git commit -m "fix: enforce formula sandbox and terminal parsing"
          git push
