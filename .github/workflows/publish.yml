name: Publish

# Tag-triggered release pipeline for the qx-finkit Rust crate.
# Python wheels are published from the validated multi-platform wheel set in
# `python-wheels.yml` using PyPI Trusted Publishing.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-tag:
    name: Tag matches the workspace version
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Read the version through the repository's own reader rather than
      # re-parsing Cargo.toml here: a second parser is a second thing that can
      # disagree with `check_versions.py`.
      - name: Assert the tag equals the workspace version
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, "scripts")
          from check_versions import read_workspace_version

          version = read_workspace_version()
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              sys.exit(f"tag {tag!r} does not match workspace version {version!r}")
          print(f"OK: tag {tag} matches workspace version {version}")
          PY
      - name: Check release versions and changelog structure
        run: |
          python scripts/check_versions.py
          python scripts/check_changelog.py CHANGELOG.md

  crates-io:
    name: Publish to crates.io
    needs: verify-tag
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fail early when the registry token is missing
        # Without this the job dies inside `cargo publish` with a message that
        # does not say which secret is absent.
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN secret is not configured"
            exit 1
          fi
      - name: Build the exact docs.rs configuration
        # `no_std` is an intentionally supported standalone feature and cannot
        # be combined with `std`, so `--all-features` is not a valid build for
        # this crate. Match the supported default surface listed in the
        # `[package.metadata.docs.rs]` feature allowlist.
        env:
          RUSTDOCFLAGS: "--cfg docsrs -D warnings"
        run: cargo doc -p qx-finkit --no-deps --no-default-features --features "std formula serde tracing metrics formula-jit formula-simd indicators-all" --locked
      - name: Dry run
        # Packages, verifies the packaged crate compiles, and validates the
        # publish-specific metadata that `cargo package` does not check.
        run: cargo publish -p qx-finkit --locked --dry-run
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p qx-finkit --locked
