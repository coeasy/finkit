name: Apply extrema round 6

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply extrema convergence
        run: |
          python scripts/apply_extrema_into_round6.py
          cargo fmt --all
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core ffi scripts .github/workflows
          git diff --cached --quiet || git commit -m "perf: converge extrema kernels and into paths"
          git push
