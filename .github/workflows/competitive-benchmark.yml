name: Competitive benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: competitive-benchmark-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  talib-head-to-head:
    name: TA-Lib C head-to-head
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Resolve pinned TA-Lib C version
        id: talib-version
        # The head-to-head must link the *same* TA-Lib C release the numeric
        # contract pins, otherwise the guardrail silently measures Finkit
        # against a superseded upstream. Reading it from the contract makes
        # drift impossible: bump the contract, and this job follows.
        # This step runs after `setup-python` so that `python` is on PATH.
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib

          matrix = json.loads(
              pathlib.Path("tests/contracts/talib_coverage_matrix_v1.json").read_text(
                  encoding="utf-8"
              )
          )
          version = matrix["talib_core_version"]
          if not version or not isinstance(version, str):
              raise SystemExit("talib_core_version missing from the coverage matrix")
          print(f"pinned TA-Lib C version: {version}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"version={version}\n")
          PY
      - name: Install TA-Lib ${{ steps.talib-version.outputs.version }}
        uses: TA-Lib/setup-ta-lib@v1
        with:
          version: ${{ steps.talib-version.outputs.version }}
      - name: Run paired Criterion benchmarks
        run: cargo bench -p finkit --bench talib_c_comparison --features talib-c --locked
      - name: Render report and reject incomplete discovery
        run: |
          mkdir -p dist/bench
          python scripts/bench_report.py \
            --criterion-dir target/criterion \
            --output dist/bench/finkit-vs-talib.md \
            --json-out dist/bench/results.json \
            --require-pairs 6
      - name: Enforce competitive guardrail
        run: |
          python scripts/bench_report.py \
            --criterion-dir target/criterion \
            --output dist/bench/finkit-vs-talib.md \
            --json-out dist/bench/results.json \
            --require-pairs 6 \
            --gate \
            --threshold 25
      - name: Verify and record environment
        # Refuse to publish evidence whose upstream version disagrees with the
        # contract. A silent mismatch is the failure mode this job exists to
        # prevent: a guardrail that passes against the wrong TA-Lib proves
        # nothing.
        env:
          PINNED_TALIB_C: ${{ steps.talib-version.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          import platform
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          def cmd(*args):
              try:
                  return subprocess.check_output(args, text=True, stderr=subprocess.STDOUT).strip()
              except Exception:
                  return None

          pinned = os.environ["PINNED_TALIB_C"]
          installed = cmd("pkg-config", "--modversion", "ta-lib")
          if installed is not None and installed != pinned:
              raise SystemExit(
                  f"installed TA-Lib C {installed} does not match the pinned contract "
                  f"version {pinned}; refusing to record misleading benchmark evidence"
              )

          payload = {
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "commit": cmd("git", "rev-parse", "HEAD"),
              "platform": platform.platform(),
              "machine": platform.machine(),
              "processor": platform.processor(),
              "rustc": cmd("rustc", "--version", "--verbose"),
              "cargo": cmd("cargo", "--version"),
              "talib": installed,
              "talib_pinned": pinned,
          }
          Path("dist/bench/environment.json").write_text(json.dumps(payload, indent=2) + "\n")
          PY
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: finkit-vs-talib-${{ github.sha }}
          path: dist/bench
          if-no-files-found: error
          retention-days: 30
