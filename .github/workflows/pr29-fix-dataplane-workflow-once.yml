name: PR29 fix dataplane workflow once

on:
  push:
    branches:
      - feat/factor-research-architecture
    paths:
      - .github/workflows/pr29-fix-dataplane-workflow-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply exact clippy fix to temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/pr29-artifact-dataplane-once.yml')
          text = path.read_text()
          old = 'factor_returns(request.frame, &computed_weights, forward_ref)?;'
          new = 'factor_returns(request.frame, computed_weights, forward_ref)?;'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one op-ref target, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          test "$(git diff --name-only)" = '.github/workflows/pr29-artifact-dataplane-once.yml'
          grep -F 'factor_returns(request.frame, computed_weights, forward_ref)?;' .github/workflows/pr29-artifact-dataplane-once.yml
      - name: Commit temporary workflow fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/pr29-artifact-dataplane-once.yml
          git commit -m 'fix(ci): satisfy artifact dataplane clippy gate'
          git push origin HEAD:feat/factor-research-architecture
