name: Python Package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-wheel:
    name: Build Linux abi3 wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Install build dependencies
        run: python -m pip install --upgrade pip "maturin>=1.5,<2.0" numpy

      - name: Refresh workspace lock metadata
        run: cargo metadata --format-version 1 > /dev/null

      - name: Build Finkit abi3 wheel
        working-directory: ffi/python-binding
        run: maturin build --release --features abi3 --out ../../dist

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: finkit-python-wheel-linux
          path: dist/finkit-*.whl
          if-no-files-found: error

  install-smoke:
    name: Install smoke / Python ${{ matrix.python-version }}
    needs: build-wheel
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11", "3.13"]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@v4
        with:
          name: finkit-python-wheel-linux
          path: dist

      - name: Install wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy dist/finkit-*.whl

      - name: Run installed-package smoke test
        shell: bash
        run: |
          python - <<'PY'
          import numpy as np
          import finkit

          assert finkit.__version__ == "0.1.0", finkit.__version__
          close = np.arange(1.0, 9.0, dtype=np.float64)
          result = finkit.sma(close, 3)
          assert len(result) == len(close)
          assert any(np.isfinite(v) for v in result)
          print("Finkit", finkit.__version__, "SMA smoke test OK")
          PY
