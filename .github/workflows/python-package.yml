name: Python Package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  wheel-linux:
    name: Build and install wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Install build dependencies
        run: python -m pip install --upgrade pip "maturin>=1.5,<2.0" numpy

      - name: Build Finkit wheel
        working-directory: ffi/python-binding
        run: maturin build --release --out ../../dist

      - name: Install built wheel
        shell: bash
        run: python -m pip install dist/finkit-*.whl

      - name: Smoke test installed package
        shell: bash
        run: |
          python - <<'PY'
          import numpy as np
          import finkit

          assert finkit.__version__ == "0.1.0", finkit.__version__
          close = np.arange(1.0, 9.0, dtype=np.float64)
          result = finkit.sma(close, 3)
          assert len(result) == len(close)
          assert any(np.isfinite(v) for v in result)
          print("Finkit", finkit.__version__, "SMA smoke test OK")
          PY

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: finkit-python-wheel-linux
          path: dist/finkit-*.whl
          if-no-files-found: error
