name: PR14 planner finalization

on:
  push:
    branches:
      - feat/compute-runtime-factorplan-v012

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/compute-runtime-factorplan-v012
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Switch FactorPlan execute to precompiled topology
        shell: python
        run: |
          from pathlib import Path

          compute = Path("core/src/compute.rs")
          source = compute.read_text(encoding="utf-8")
          old = '''    /// Execute the plan through the current factor engine implementation.
    ///
    /// This preserves the existing memoization and result semantics. A future
    /// optimized backend can consume [`Self::execution_order`] directly
    /// without changing this public planning contract.
    pub fn execute(
        &self,
        engine: &FactorEngine,
        context: &FactorContext,
    ) -> FactorResult<BTreeMap<String, Vec<f64>>> {
        self.validate_context(context)?;
        self.validate_engine(engine)?;
        let targets: Vec<&str> = self.targets.iter().map(String::as_str).collect();
        engine.evaluate_many(&targets, context)
    }
'''
          new = '''    /// Execute the plan through its precompiled topological order.
    ///
    /// The source-level API remains compatible with the first v0.1.2 planning
    /// contract, but dependency traversal is no longer rediscovered on every
    /// call. Context and registry snapshots are validated before the optimized
    /// plan executor runs.
    pub fn execute(
        &self,
        engine: &FactorEngine,
        context: &FactorContext,
    ) -> FactorResult<BTreeMap<String, Vec<f64>>> {
        self.validate_context(context)?;
        self.validate_engine(engine)?;
        self.execute_precompiled(engine, context)
    }
'''
          if old not in source:
              raise SystemExit("expected FactorPlan::execute block not found")
          compute.write_text(source.replace(old, new, 1), encoding="utf-8")

          docs = Path("docs/core-contracts.md")
          text = docs.read_text(encoding="utf-8")
          old_docs = '''`FactorPlan::execute` remains as the compatibility entry point using the
established recursive evaluator, so existing callers are not forced to migrate
in v0.1.2.
'''
          new_docs = '''`FactorPlan::execute` keeps its existing source signature but now validates the
context/registry and delegates to the precompiled topology, so existing callers
receive the optimized path without migrating API calls. `execute_precompiled`
remains available when callers want to state that execution mode explicitly.
'''
          if old_docs not in text:
              raise SystemExit("expected FactorPlan docs paragraph not found")
          docs.write_text(text.replace(old_docs, new_docs, 1), encoding="utf-8")
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit planner and formatting changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No finalization changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core cli docs
          git commit -m "perf: execute factor plans from precompiled topology"
          git push origin HEAD:feat/compute-runtime-factorplan-v012
