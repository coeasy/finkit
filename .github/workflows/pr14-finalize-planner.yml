name: PR14 planner finalization

on:
  push:
    branches:
      - feat/compute-runtime-factorplan-v012

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/compute-runtime-factorplan-v012
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Switch FactorPlan execute to precompiled topology
        run: >
          python -c 'from pathlib import Path; p=Path("core/src/compute.rs"); s=p.read_text(encoding="utf-8"); old="        let targets: Vec<&str> = self.targets.iter().map(String::as_str).collect();\n        engine.evaluate_many(&targets, context)"; new="        self.execute_precompiled(engine, context)"; assert old in s, "expected recursive FactorPlan execute body not found"; p.write_text(s.replace(old, new, 1), encoding="utf-8")'
      - name: Refresh FactorPlan execution documentation
        run: >
          python -c 'from pathlib import Path; p=Path("docs/core-contracts.md"); s=p.read_text(encoding="utf-8"); old="`FactorPlan::execute` remains as the compatibility entry point using the\nestablished recursive evaluator, so existing callers are not forced to migrate\nin v0.1.2."; new="`FactorPlan::execute` keeps its existing source signature but now validates the\ncontext/registry and delegates to the precompiled topology, so existing callers\nreceive the optimized path without migrating API calls. `execute_precompiled`\nremains available when callers want to state that execution mode explicitly."; assert old in s, "expected FactorPlan docs paragraph not found"; p.write_text(s.replace(old, new, 1), encoding="utf-8")'
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit planner and formatting changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No finalization changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core cli docs
          git commit -m "perf: execute factor plans from precompiled topology"
          git push origin HEAD:feat/compute-runtime-factorplan-v012
