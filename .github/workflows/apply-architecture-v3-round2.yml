name: Apply Architecture v3 round 2

on:
  push:
    branches:
      - perf/outperform-talib-v3-20260904
    paths:
      - '.github/workflows/apply-architecture-v3-round2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply Architecture v3.2 convergence
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          payload = ''
          target = Path('scripts/.apply_architecture_v3_round2.py')
          target.write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          python scripts/.apply_architecture_v3_round2.py
          rm scripts/.apply_architecture_v3_round2.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Validate convergence contracts
        run: |
          cargo test -p finkit --lib --locked
          cargo test -p finkit --test talib_semantic_contract --locked
          cargo check -p finkit-python --features abi3 --locked
          git diff --check
      - name: Commit convergence
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No convergence changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            core/src/math/rolling_stats.rs \
            core/src/indicators/overlap.rs \
            core/src/indicators/momentum.rs \
            core/src/unified_executor.rs \
            core/src/formula/unified_dispatch.rs \
            core/src/formula/mod.rs \
            ffi/python-binding/src/native_fast_path.rs
          git commit -m 'refactor(v3): converge rolling extrema and formula buffers'
          git pull --rebase origin perf/outperform-talib-v3-20260904
          git push origin HEAD:perf/outperform-talib-v3-20260904
