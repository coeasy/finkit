name: PR14 round3 diagnostic

on:
  push:
    branches:
      - feat/compute-runtime-factorplan-v012

permissions:
  contents: write

concurrency:
  group: pr14-round3-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/compute-runtime-factorplan-v012
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Apply v0.1.3 repairs
        run: |
          python scripts/check_versions.py --fix
          python .ci/pr14_harden.py round1
          python .ci/pr14_round1_compat_fix.py
          python .ci/pr14_round2_fix.py
          python .ci/pr14_round2_tests_fix.py
          python .ci/pr14_round2_golden_fix.py
          python .ci/pr14_semantic_contract_fix.py
          python .ci/pr14_semantic_contract_fix2.py
          python .ci/pr14_semantic_contract_fix3.py
          python .ci/pr14_semantic_contract_fix4.py
          python .ci/pr14_semantic_contract_fix5.py
          python .ci/pr14_harden.py round3
          cargo fmt --all
      - name: Round3 compute IR unit tests
        run: cargo test -p finkit --lib formula::compute_ir --locked
      - name: Round3 executor unit tests
        run: cargo test -p finkit --lib formula::executor --locked
      - name: Round3 remaining formula unit tests
        run: cargo test -p finkit --lib formula:: --locked
      - name: Round3 non-formula core unit tests
        run: cargo test -p finkit --lib --locked -- --skip formula::
