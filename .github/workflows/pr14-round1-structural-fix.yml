name: PR14 three-round hardening

on:
  push:
    branches:
      - feat/compute-runtime-factorplan-v012

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/compute-runtime-factorplan-v012
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Round 1 - clean binding warnings and workflow runtime debt
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences, found {count}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          duplicate = '''        "beta" => IndicatorResult::Error(
              "Beta requires benchmark data (use individual function)".to_string(),
          ),
          "correl" | "correlation" => IndicatorResult::Error(
              "Correlation requires second series data (use individual function)".to_string(),
          ),
'''
          replace_exact('ffi/python-binding/src/lib.rs', duplicate, '')

          replace_exact('.github/workflows/ci.yml', 'actions/checkout@v4', 'actions/checkout@v7', 7)
          replace_exact('.github/workflows/docs-check.yml', 'actions/checkout@v4', 'actions/checkout@v7')
          replace_exact('.github/workflows/python-wheels.yml', 'actions/checkout@v4', 'actions/checkout@v7', 4)
          replace_exact('.github/workflows/python-wheels.yml', 'actions/upload-artifact@v4', 'actions/upload-artifact@v7')
          replace_exact('.github/workflows/python-wheels.yml', 'actions/download-artifact@v4', 'actions/download-artifact@v8', 3)
          replace_exact(
              '.github/workflows/python-wheels.yml',
              'PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4',
              'PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0',
          )
          PY
          cargo fmt --all
          RUSTFLAGS="-Dwarnings" cargo check -p finkit-python --locked

      - name: Round 2 - canonicalize registry aliases in Compute IR
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          p = Path('core/src/formula/compute_ir.rs')
          s = p.read_text(encoding='utf-8')

          old_call = '''            AstNode::FunctionCall { name, args } => {
                  let dependencies = args.iter().map(|arg| self.lower(arg)).collect();
                  let capabilities = self.function_capabilities(name);
                  if capabilities.effect.is_pure() {
                      self.add_node(
                          format!("CALL:{}", canonical_name(name)),
                          dependencies,
                          capabilities,
                      )
                  } else {
                      self.add_effect(
                          format!("CALL:{}", canonical_name(name)),
                          dependencies,
                          capabilities,
                      )
                  }
              }
'''
          new_call = '''            AstNode::FunctionCall { name, args } => {
                  let dependencies = args.iter().map(|arg| self.lower(arg)).collect();
                  let (operation_name, capabilities) = self.function_metadata(name);
                  if capabilities.effect.is_pure() {
                      self.add_node(format!("CALL:{operation_name}"), dependencies, capabilities)
                  } else {
                      self.add_effect(format!("CALL:{operation_name}"), dependencies, capabilities)
                  }
              }
'''
          if s.count(old_call) != 1:
              raise SystemExit('FunctionCall lowering block not found exactly once')
          s = s.replace(old_call, new_call, 1)

          old_meta = '''    fn function_capabilities(&self, name: &str) -> ComputeCapabilities {
          self.registry.get(name).map_or_else(
              || ComputeCapabilities {
                  // Unknown/custom formula functions are deliberately conservative.
                  // Once registered in the SSOT they regain precise capabilities.
                  deterministic: false,
                  streaming: false,
                  stateful: true,
                  lookback: LookbackRequirement::Dynamic,
                  effect: ComputeEffect::Stateful,
              },
              ComputeCapabilities::from_function_spec,
          )
      }
'''
          new_meta = '''    fn function_metadata(&self, name: &str) -> (String, ComputeCapabilities) {
          self.registry.get(name).map_or_else(
              || {
                  (
                      canonical_name(name),
                      ComputeCapabilities {
                          // Unknown/custom formula functions are deliberately conservative.
                          // Once registered in the SSOT they regain precise capabilities.
                          deterministic: false,
                          streaming: false,
                          stateful: true,
                          lookback: LookbackRequirement::Dynamic,
                          effect: ComputeEffect::Stateful,
                      },
                  )
              },
              |spec| {
                  (
                      canonical_name(spec.name),
                      ComputeCapabilities::from_function_spec(spec),
                  )
              },
          )
      }
'''
          if s.count(old_meta) != 1:
              raise SystemExit('function_capabilities block not found exactly once')
          s = s.replace(old_meta, new_meta, 1)

          old_expect = '.find(|&id| plan.node(id).unwrap().operation == "CALL:MA")'
          if s.count(old_expect) != 1:
              raise SystemExit('CALL:MA test expectation not found exactly once')
          s = s.replace(old_expect, '.find(|&id| plan.node(id).unwrap().operation == "CALL:SMA")', 1)

          marker = '''    #[test]
      fn unknown_function_is_conservative_until_registered() {
'''
          regression = '''    #[test]
      fn aliases_lower_to_the_same_canonical_operation() {
          let ma = FormulaComputePlan::compile(&parse_formula("MA(CLOSE,5)").unwrap()).unwrap();
          let sma = FormulaComputePlan::compile(&parse_formula("SMA(CLOSE,5)").unwrap()).unwrap();

          let ma_node = ma.plan().node(ma.root()).unwrap();
          let sma_node = sma.plan().node(sma.root()).unwrap();
          assert_eq!(ma_node.operation, "CALL:SMA");
          assert_eq!(sma_node.operation, "CALL:SMA");
          assert_eq!(ma_node.capabilities, sma_node.capabilities);
      }

'''
          if s.count(marker) != 1:
              raise SystemExit('unknown-function test marker not found exactly once')
          s = s.replace(marker, regression + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
          cargo fmt --all
          cargo test -p finkit --lib formula::compute_ir --locked

      - name: Round 3 - harden opaque control flow and loop limits
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          p = Path('core/src/formula/compute_ir.rs')
          s = p.read_text(encoding='utf-8')

          old_fields = '''    last_write: BTreeMap<String, ComputeNodeId>,
          last_effect: Option<ComputeNodeId>,
'''
          new_fields = '''    last_write: BTreeMap<String, ComputeNodeId>,
          last_effect: Option<ComputeNodeId>,
          last_control_flow: Option<ComputeNodeId>,
'''
          if s.count(old_fields) != 1:
              raise SystemExit('FormulaLowerer fields marker not found')
          s = s.replace(old_fields, new_fields, 1)

          old_init = '''            last_write: BTreeMap::new(),
              last_effect: None,
'''
          new_init = '''            last_write: BTreeMap::new(),
              last_effect: None,
              last_control_flow: None,
'''
          if s.count(old_init) != 1:
              raise SystemExit('FormulaLowerer init marker not found')
          s = s.replace(old_init, new_init, 1)

          old_for_tail = '''                self.last_write.insert(canonical_name(var), id);
                  id
              }
              AstNode::WhileLoop { cond, .. } => {
                  let cond = self.lower(cond);
                  self.add_effect("WHILE_LOOP", vec![cond], opaque_control_flow_capabilities())
              }
'''
          new_for_tail = '''                self.last_write.insert(canonical_name(var), id);
                  self.last_control_flow = Some(id);
                  id
              }
              AstNode::WhileLoop { cond, .. } => {
                  let cond = self.lower(cond);
                  let id = self.add_effect(
                      "WHILE_LOOP",
                      vec![cond],
                      opaque_control_flow_capabilities(),
                  );
                  self.last_control_flow = Some(id);
                  id
              }
'''
          if s.count(old_for_tail) != 1:
              raise SystemExit('opaque loop lowering block not found')
          s = s.replace(old_for_tail, new_for_tail, 1)

          old_var = '''    fn lower_variable(&mut self, name: &str) -> ComputeNodeId {
          let key = canonical_name(name);
          let dependencies = self.last_write.get(&key).copied().into_iter().collect();
          self.add_pure(format!("VARIABLE:{key}"), dependencies)
      }
'''
          new_var = '''    fn lower_variable(&mut self, name: &str) -> ComputeNodeId {
          let key = canonical_name(name);
          let mut dependencies = Vec::with_capacity(2);
          if let Some(write) = self.last_write.get(&key).copied() {
              dependencies.push(write);
          }
          if let Some(barrier) = self.last_control_flow {
              if !dependencies.contains(&barrier) {
                  dependencies.push(barrier);
              }
          }
          self.add_pure(format!("VARIABLE:{key}"), dependencies)
      }
'''
          if s.count(old_var) != 1:
              raise SystemExit('lower_variable block not found')
          s = s.replace(old_var, new_var, 1)

          marker = '''    #[test]
      fn drawing_commands_are_effectful_and_ordered() {
'''
          regression = '''    #[test]
      fn reads_after_opaque_control_flow_depend_on_the_control_barrier() {
          let ast = AstNode::Statements(vec![
              AstNode::Assignment {
                  name: "X".to_string(),
                  expr: Box::new(AstNode::Number(0.0)),
              },
              AstNode::WhileLoop {
                  cond: Box::new(AstNode::Number(0.0)),
                  body: vec![AstNode::Assignment {
                      name: "X".to_string(),
                      expr: Box::new(AstNode::Number(1.0)),
                  }],
              },
              AstNode::Variable("X".to_string()),
          ]);
          let formula_plan = FormulaComputePlan::compile(&ast).unwrap();
          let plan = formula_plan.plan();
          let barrier = plan
              .execution_order()
              .iter()
              .copied()
              .find(|&id| plan.node(id).unwrap().operation == "WHILE_LOOP")
              .unwrap();
          let read = plan
              .execution_order()
              .iter()
              .copied()
              .filter(|&id| plan.node(id).unwrap().operation == "VARIABLE:X")
              .last()
              .unwrap();

          assert!(plan.node(read).unwrap().dependencies.contains(&barrier));
      }

'''
          if s.count(marker) != 1:
              raise SystemExit('drawing test marker not found')
          s = s.replace(marker, regression + marker, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('core/src/formula/executor.rs')
          s = p.read_text(encoding='utf-8')
          alias = 'type FormulaFn = fn(&FormulaContext, &[Array1<f64>]) -> Result<Array1<f64>, FormulaError>;\n'
          replacement = alias + '''\nconst MAX_LOOP_ITERATIONS: usize = 10_000;\n\nfn loop_iteration_limit_error(kind: &str) -> FormulaError {\n    FormulaError::RuntimeError(format!(\n        "{kind} loop exceeded maximum iterations ({MAX_LOOP_ITERATIONS})"\n    ))\n}\n'''
          if s.count(alias) != 1:
              raise SystemExit('FormulaFn alias marker not found')
          s = s.replace(alias, replacement, 1)

          if s.count('                let max_iterations = 10000i64;\n') != 3:
              raise SystemExit('expected three FOR max_iterations declarations')
          s = s.replace('                let max_iterations = 10000i64;\n', '')
          if s.count('                    if count as i64 >= max_iterations {') != 3:
              raise SystemExit('expected three FOR max iteration guards')
          s = s.replace(
              '                    if count as i64 >= max_iterations {',
              '                    if count >= MAX_LOOP_ITERATIONS {',
          )
          old_for_error = '''                        return Err(FormulaError::RuntimeError(format!(
                              "FOR loop exceeded maximum iterations ({})",
                              max_iterations
                          )));
'''
          if s.count(old_for_error) != 3:
              raise SystemExit('expected three FOR limit errors')
          s = s.replace(old_for_error, '                        return Err(loop_iteration_limit_error("FOR"));\n')

          old_plain_while = '''            AstNode::WhileLoop { cond, body } => {
                  let mut result = FormulaValue::Scalar(0.0);
                  let max_iterations = 10000usize;
                  for _ in 0..max_iterations {
                      let cond_val = self.execute_val(cond, ctx)?;
                      let cond_arr = cond_val.to_array(ctx.data_len);
                      if !cond_arr.iter().any(|&v| v > 0.0) {
                          break;
                      }
                      for stmt in body {
                          result = self.execute_val(stmt, ctx)?;
                      }
                  }
                  Ok(result)
              }
'''
          new_plain_while = '''            AstNode::WhileLoop { cond, body } => {
                  let mut result = FormulaValue::Scalar(0.0);
                  let mut iterations = 0usize;
                  loop {
                      let cond_val = self.execute_val(cond, ctx)?;
                      let cond_arr = cond_val.to_array(ctx.data_len);
                      if !cond_arr.iter().any(|&v| v > 0.0) {
                          break;
                      }
                      if iterations >= MAX_LOOP_ITERATIONS {
                          return Err(loop_iteration_limit_error("WHILE"));
                      }
                      for stmt in body {
                          result = self.execute_val(stmt, ctx)?;
                      }
                      iterations += 1;
                  }
                  Ok(result)
              }
'''
          if s.count(old_plain_while) != 1:
              raise SystemExit('plain WHILE block not found exactly once')
          s = s.replace(old_plain_while, new_plain_while, 1)

          old_cached_while = '''            AstNode::WhileLoop { cond, body } => {
                  let mut result = pool.get_buffer(ctx.data_len);
                  let max_iterations = 10000usize;
                  for _ in 0..max_iterations {
                      let cond_val = self.execute_with_pool_cached(cond, ctx, pool, name_cache)?;
                      let should_break = !cond_val.iter().any(|&v| v > 0.0);
                      pool.return_buffer(cond_val);
                      if should_break {
                          break;
                      }
                      for stmt in body {
                          let new_result =
                              self.execute_with_pool_cached(stmt, ctx, pool, name_cache)?;
                          pool.return_buffer(result);
                          result = new_result;
                      }
                  }
                  Ok(result)
              }
'''
          new_cached_while = '''            AstNode::WhileLoop { cond, body } => {
                  let mut result = pool.get_buffer(ctx.data_len);
                  let mut iterations = 0usize;
                  loop {
                      let cond_val = self.execute_with_pool_cached(cond, ctx, pool, name_cache)?;
                      let should_break = !cond_val.iter().any(|&v| v > 0.0);
                      pool.return_buffer(cond_val);
                      if should_break {
                          break;
                      }
                      if iterations >= MAX_LOOP_ITERATIONS {
                          pool.return_buffer(result);
                          return Err(loop_iteration_limit_error("WHILE"));
                      }
                      for stmt in body {
                          let new_result =
                              self.execute_with_pool_cached(stmt, ctx, pool, name_cache)?;
                          pool.return_buffer(result);
                          result = new_result;
                      }
                      iterations += 1;
                  }
                  Ok(result)
              }
'''
          if s.count(old_cached_while) != 1:
              raise SystemExit('cached WHILE block not found exactly once')
          s = s.replace(old_cached_while, new_cached_while, 1)

          old_pooled_while = '''            AstNode::WhileLoop { cond, body } => {
                  let mut result = pool.get_buffer(ctx.data_len);
                  let max_iterations = 10000usize;
                  for _ in 0..max_iterations {
                      let cond_val = self.execute_with_pool(cond, ctx, pool)?;
                      let should_break = !cond_val.iter().any(|&v| v > 0.0);
                      pool.return_buffer(cond_val);
                      if should_break {
                          break;
                      }
                      for stmt in body {
                          let new_result = self.execute_with_pool(stmt, ctx, pool)?;
                          pool.return_buffer(result);
                          result = new_result;
                      }
                  }
                  Ok(result)
              }
'''
          new_pooled_while = '''            AstNode::WhileLoop { cond, body } => {
                  let mut result = pool.get_buffer(ctx.data_len);
                  let mut iterations = 0usize;
                  loop {
                      let cond_val = self.execute_with_pool(cond, ctx, pool)?;
                      let should_break = !cond_val.iter().any(|&v| v > 0.0);
                      pool.return_buffer(cond_val);
                      if should_break {
                          break;
                      }
                      if iterations >= MAX_LOOP_ITERATIONS {
                          pool.return_buffer(result);
                          return Err(loop_iteration_limit_error("WHILE"));
                      }
                      for stmt in body {
                          let new_result = self.execute_with_pool(stmt, ctx, pool)?;
                          pool.return_buffer(result);
                          result = new_result;
                      }
                      iterations += 1;
                  }
                  Ok(result)
              }
'''
          if s.count(old_pooled_while) != 1:
              raise SystemExit('pooled WHILE block not found exactly once')
          s = s.replace(old_pooled_while, new_pooled_while, 1)
          p.write_text(s, encoding='utf-8')

          test = Path('core/tests/formula_control_flow.rs')
          if test.exists():
              raise SystemExit('formula_control_flow.rs already exists')
          test.write_text(r'''use finkit::formula::{AstNode, FormulaContext, FormulaError, FormulaExecutor};
use ndarray::Array1;

fn context() -> FormulaContext {
    let values = Array1::from_vec(vec![1.0]);
    FormulaContext::new(
        values.clone(),
        values.clone(),
        values.clone(),
        values.clone(),
        values,
        None,
    )
}

fn infinite_while() -> AstNode {
    AstNode::WhileLoop {
        cond: Box::new(AstNode::Number(1.0)),
        body: Vec::new(),
    }
}

fn assert_while_limit(error: FormulaError) {
    assert!(matches!(
        error,
        FormulaError::RuntimeError(message)
            if message == "WHILE loop exceeded maximum iterations (10000)"
    ));
}

#[test]
fn while_limit_is_consistent_across_executor_paths() {
    let executor = FormulaExecutor::new();
    let ast = infinite_while();

    let mut standard = context();
    assert_while_limit(executor.execute(&ast, &mut standard).unwrap_err());

    let mut cached = context();
    assert_while_limit(
        executor
            .execute_zero_copy_cached(&ast, &mut cached)
            .unwrap_err(),
    );

    let mut pooled = context();
    assert_while_limit(executor.execute_zero_copy(&ast, &mut pooled).unwrap_err());
}
''', encoding='utf-8')
          PY
          cargo fmt --all
          cargo test -p finkit --locked

      - name: Final strict validation
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --locked
          cargo clippy -p finkit --all-targets --locked -- -D warnings
          RUSTFLAGS="-Dwarnings" cargo check -p finkit-python --locked

      - name: Commit repairs and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/pr14-round1-structural-fix.yml
          git add -A
          git commit -m "fix: complete three-round compute runtime hardening"
          git push origin HEAD:feat/compute-runtime-factorplan-v012
