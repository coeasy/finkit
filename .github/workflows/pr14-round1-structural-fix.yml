name: PR14 three-round hardening

on:
  push:
    branches:
      - feat/compute-runtime-factorplan-v012

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/compute-runtime-factorplan-v012
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Round 1 structural and binding repair
        run: |
          python .ci/pr14_harden.py round1
          cargo fmt --all
          cargo test -p finkit factor_plan_direct_paths_reject_stale_registry_dependencies --locked
          RUSTFLAGS="-Dwarnings" cargo check -p finkit-python --locked

      - name: Round 2 canonical IR repair
        run: |
          python .ci/pr14_harden.py round2
          cargo fmt --all
          cargo test -p finkit --lib formula::compute_ir --locked

      - name: Round 3 control flow repair
        run: |
          python .ci/pr14_harden.py round3
          cargo fmt --all
          cargo test -p finkit --locked

      - name: Final validation
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --locked
          cargo clippy -p finkit --all-targets --locked -- -D warnings
          RUSTFLAGS="-Dwarnings" cargo check -p finkit-python --locked
          cargo clippy --workspace --all-targets --locked

      - name: Commit repairs and clean temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/pr14-round1-structural-fix.yml
          rm .ci/pr14_harden.py
          git add -A
          git commit -m "fix: complete three-round compute runtime hardening"
          git push origin HEAD:feat/compute-runtime-factorplan-v012
