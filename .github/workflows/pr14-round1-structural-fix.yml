name: PR14 final cleanup

on:
  push:
    branches:
      - feat/compute-runtime-factorplan-v012

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/compute-runtime-factorplan-v012
      - name: Harden release-version checks and clean PR-only repair assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/check_versions.py')
          text = path.read_text(encoding='utf-8')
          old_check = (
              '        elif "0.1.0" in text:\n'
              '            errors.append(f"{path.relative_to(ROOT)}: contains legacy 0.1.0 reference")\n'
          )
          new_check = (
              '        else:\n'
              '            release_versions = set(re.findall(r"(?<!\\d)0\\.1\\.\\d+(?!\\d)", text))\n'
              '            stale_versions = sorted(version for version in release_versions if version != canonical)\n'
              '            if stale_versions:\n'
              '                errors.append(\n'
              '                    f"{path.relative_to(ROOT)}: contains stale release version(s) "\n'
              '                    f"{\', \'.join(stale_versions)}; expected {canonical}"\n'
              '                )\n'
          )
          if text.count(old_check) != 1:
              raise SystemExit('version-check contract anchor changed')
          text = text.replace(old_check, new_check, 1)

          old_fix = '        path.write_text(text.replace("0.1.0", canonical), encoding="utf-8")\n'
          new_fix = (
              '        text = re.sub(r"(?<!\\d)0\\.1\\.\\d+(?!\\d)", canonical, text)\n'
              '        path.write_text(text, encoding="utf-8")\n'
          )
          if text.count(old_fix) != 1:
              raise SystemExit('version-fix contract anchor changed')
          text = text.replace(old_fix, new_fix, 1)
          path.write_text(text, encoding='utf-8')
          PY

          python scripts/check_versions.py --fix
          python scripts/gen_ssot_docs.py --generate
          python scripts/check_versions.py
          python scripts/gen_ssot_docs.py --check
          rm -f .ci/pr14*
          rmdir .ci 2>/dev/null || true

      - name: Commit final production cleanup
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git restore --source=HEAD -- .github/workflows
          git add -A
          if git diff --cached --quiet; then
            echo 'No cleanup changes to commit.'
            exit 0
          fi
          git commit -m 'chore: finalize v0.1.3 release metadata and cleanup'
          git push origin HEAD:feat/compute-runtime-factorplan-v012
