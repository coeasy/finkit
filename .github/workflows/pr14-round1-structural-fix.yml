name: PR14 core regression diagnostic

on:
  push:
    branches:
      - feat/compute-runtime-factorplan-v012

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/compute-runtime-factorplan-v012
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Apply v0.1.3 repairs
        run: |
          python scripts/check_versions.py --fix
          python .ci/pr14_harden.py round1
          python .ci/pr14_round1_compat_fix.py
          python .ci/pr14_round2_fix.py
          python .ci/pr14_round2_tests_fix.py
          python .ci/pr14_round2_golden_fix.py
          python .ci/pr14_semantic_contract_fix.py
          python .ci/pr14_semantic_contract_fix2.py
          python .ci/pr14_semantic_contract_fix3.py
          python .ci/pr14_semantic_contract_fix4.py
          python .ci/pr14_semantic_contract_fix5.py
          python .ci/pr14_harden.py round3
          sed -i '/self.last_write.insert(canonical_name(var), id);/{n;/self.last_control_flow = Some(id);/d;}' core/src/formula/compute_ir.rs
          cargo fmt --all
      - name: All formula unit tests
        run: |
          cargo test -p finkit --lib 'formula::' --locked
      - name: Factor unit tests
        run: |
          cargo test -p finkit --lib 'factors::' --locked
      - name: Registry unit tests
        run: |
          cargo test -p finkit --lib 'registry::' --locked
      - name: Schema unit tests
        run: |
          cargo test -p finkit --lib 'schema::' --locked
      - name: Remaining core unit tests
        run: |
          cargo test -p finkit --lib --locked -- --skip 'formula::' --skip 'factors::' --skip 'registry::' --skip 'schema::'
