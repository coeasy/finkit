name: PR14 three-round hardening

on:
  push:
    branches:
      - feat/compute-runtime-factorplan-v012

permissions:
  contents: write

concurrency:
  group: pr14-three-round-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/compute-runtime-factorplan-v012
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Round 1 structural and binding repair
        run: |
          python .ci/pr14_harden.py round1
          python .ci/pr14_round1_compat_fix.py
          cargo fmt --all
          cargo test -p finkit factor_plan_direct_paths_reject_stale_registry_dependencies --locked
          cargo test -p finkit precompiled_plan_rejects_changed_dependency_graph --locked
          RUSTFLAGS="-Dwarnings" cargo check -p finkit-python --locked

      - name: Round 2A base registry repair
        run: |
          python .ci/pr14_round2_fix.py
          python .ci/pr14_round2_tests_fix.py
          python .ci/pr14_round2_golden_fix.py

      - name: Round 2B semantic contract repair 1
        run: python .ci/pr14_semantic_contract_fix.py

      - name: Round 2C semantic contract repair 2
        run: python .ci/pr14_semantic_contract_fix2.py

      - name: Round 2D semantic contract repair 3
        run: python .ci/pr14_semantic_contract_fix3.py

      - name: Round 2E semantic contract repair 4
        run: python .ci/pr14_semantic_contract_fix4.py

      - name: Round 2F format and generated docs
        run: |
          cargo fmt --all
          python scripts/gen_ssot_docs.py --generate

      - name: Round 2G registry tests
        run: cargo test -p finkit --lib registry::tests --locked

      - name: Round 2H compute IR tests
        run: cargo test -p finkit --lib formula::compute_ir --locked

      - name: Round 2I semantic contract tests
        run: cargo test -p finkit --lib formula::functions::pr14_semantic_contract_tests --locked

      - name: Round 2J Pine tests
        run: cargo test -p finkit --lib formula::pine --locked

      - name: Round 2K terminal golden tests
        run: cargo test -p finkit --test formula_terminal_golden --locked

      - name: Round 2L Polars integration tests
        run: cargo test -p finkit --test polars_integration_tests --features finkit-polars --locked

      - name: Round 2M schema CLI tests
        run: cargo test -p finkit-cli --test schema_cli --locked

      - name: Round 3 control flow repair
        run: |
          python .ci/pr14_harden.py round3
          cargo fmt --all
          cargo test -p finkit --locked
          cargo test -p finkit-cli --locked

      - name: Final validation
        run: |
          cargo fmt --all -- --check
          python scripts/gen_ssot_docs.py --check
          cargo check --workspace --all-targets --locked
          cargo clippy -p finkit --lib --locked -- -D warnings
          RUSTFLAGS="-Dwarnings" cargo check -p finkit-python --locked
          cargo clippy --workspace --all-targets --locked

      - name: Commit repairs and clean temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/pr14-round1-structural-fix.yml
          rm .ci/pr14_harden.py
          rm .ci/pr14_round1_compat_fix.py
          rm .ci/pr14_round2_fix.py
          rm .ci/pr14_round2_tests_fix.py
          rm .ci/pr14_round2_golden_fix.py
          rm .ci/pr14_semantic_contract_fix.py
          rm .ci/pr14_semantic_contract_fix2.py
          rm .ci/pr14_semantic_contract_fix3.py
          rm .ci/pr14_semantic_contract_fix4.py
          git add -A
          git commit -m "fix: complete three-round compute runtime hardening"
          git push origin HEAD:feat/compute-runtime-factorplan-v012
