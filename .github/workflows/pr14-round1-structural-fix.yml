name: PR14 materialize verified repairs

on:
  push:
    branches:
      - feat/compute-runtime-factorplan-v012

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/compute-runtime-factorplan-v012
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply verified v0.1.3 repair set
        run: |
          python scripts/check_versions.py --fix
          python .ci/pr14_harden.py round1
          python .ci/pr14_round1_compat_fix.py
          python .ci/pr14_round2_fix.py
          python .ci/pr14_round2_tests_fix.py
          python .ci/pr14_round2_golden_fix.py
          python .ci/pr14_semantic_contract_fix.py
          python .ci/pr14_semantic_contract_fix2.py
          python .ci/pr14_semantic_contract_fix3.py
          python .ci/pr14_semantic_contract_fix4.py
          python .ci/pr14_semantic_contract_fix5.py
          python .ci/pr14_formula_compute_ir_integration.py
          python .ci/pr14_harden.py round3
          sed -i '/self.last_write.insert(canonical_name(var), id);/{n;/self.last_control_flow = Some(id);/d;}' core/src/formula/compute_ir.rs
          python .ci/pr14_final_ci_gate.py
          python scripts/gen_ssot_docs.py --generate
          python scripts/check_versions.py --fix
          cargo fmt --all
      - name: Verify deterministic generated state
        run: |
          cargo fmt --all -- --check
          python scripts/check_versions.py
          python scripts/gen_ssot_docs.py --check
      - name: Commit production repairs
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No materialized changes to commit.'
            exit 0
          fi
          git commit -m 'feat: materialize v0.1.3 compute engine hardening'
          git push origin HEAD:feat/compute-runtime-factorplan-v012
