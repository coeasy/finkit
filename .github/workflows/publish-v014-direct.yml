name: Publish v0.1.4 direct

on:
  push:
    branches:
      - publish/v0.1.4
    paths:
      - .github/workflows/publish-v014-direct.yml

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out merged release commit
        uses: actions/checkout@v7
        with:
          ref: 6887c90552b58b2cb33c57ba3e433aab50a99355
          fetch-depth: 1
      - name: Validate canonical v0.1.4 metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_versions.py
          VERSION="$(python3 -c 'import pathlib,re; text=pathlib.Path("Cargo.toml").read_text(); print(re.search(r"(?ms)^\[workspace\.package\].*?^version\s*=\s*\"([^\"]+)\"", text).group(1))')"
          test "$VERSION" = "0.1.4"
          test "$(git rev-parse HEAD)" = "6887c90552b58b2cb33c57ba3e433aab50a99355"
      - name: Download validated Python and multi-language artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf python-artifacts multi-artifacts primary-assets supplemental-assets
          mkdir -p python-artifacts multi-artifacts primary-assets supplemental-assets
          gh run download 33851456190 --repo "$GITHUB_REPOSITORY" --pattern 'wheel-*' --dir python-artifacts
          gh run download 33851456214 --repo "$GITHUB_REPOSITORY" --pattern 'release-*' --dir multi-artifacts
          python3 - <<'PY'
          from pathlib import Path
          from shutil import copy2
          import hashlib

          primary = Path('primary-assets')
          supplemental = Path('supplemental-assets')

          def copy_unique(src, dst):
              target = dst / src.name
              if target.exists():
                  raise SystemExit(f'duplicate release filename: {src.name}')
              copy2(src, target)

          wheels = sorted(Path('python-artifacts').rglob('finkit-*.whl'))
          if len(wheels) != 4:
              raise SystemExit(f'expected 4 ABI3 wheels, found {len(wheels)}: {wheels}')
          for f in wheels:
              copy_unique(f, primary)

          multi_files = sorted(p for p in Path('multi-artifacts').rglob('*') if p.is_file())
          crate = [p for p in multi_files if p.name.startswith('finkit-') and p.suffix == '.crate']
          cli = [p for p in multi_files if p.name == 'finkit-cli-linux-x86_64']
          if len(crate) != 1 or len(cli) != 1:
              raise SystemExit(f'expected one crate and one CLI, found crate={crate}, cli={cli}')
          copy_unique(crate[0], primary)
          copy_unique(cli[0], primary)

          primary_names = {p.name for p in primary.iterdir() if p.is_file()}
          for f in multi_files:
              if f.name in primary_names:
                  continue
              copy_unique(f, supplemental)
          if not any(supplemental.iterdir()):
              raise SystemExit('no supplemental multi-language assets found')

          def checksums(folder, output_name):
              files = sorted(p for p in folder.iterdir() if p.is_file() and p.name != output_name)
              lines = []
              for p in files:
                  h = hashlib.sha256(p.read_bytes()).hexdigest()
                  lines.append(f'{h}  {p.name}')
              (folder / output_name).write_text('\n'.join(lines) + '\n', encoding='utf-8')

          checksums(primary, 'SHA256SUMS')
          checksums(supplemental, 'SHA256SUMS.multilang')
          print('Primary assets:')
          for p in sorted(primary.iterdir()):
              print(' -', p.name)
          print('Supplemental assets:')
          for p in sorted(supplemental.iterdir()):
              print(' -', p.name)
          PY
      - name: Create GitHub Release v0.1.4 and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view v0.1.4 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v0.1.4 \
              --repo "$GITHUB_REPOSITORY" \
              --target 6887c90552b58b2cb33c57ba3e433aab50a99355 \
              --title "v0.1.4" \
              --generate-notes
          fi
          gh release upload v0.1.4 --repo "$GITHUB_REPOSITORY" --clobber primary-assets/* supplemental-assets/*
          gh release view v0.1.4 --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,targetCommitish,url
