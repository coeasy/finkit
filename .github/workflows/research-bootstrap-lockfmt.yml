name: Research normalize generated state

on:
  push:
    branches:
      - feat/factor-research-architecture

permissions:
  contents: write

concurrency:
  group: research-normalize-generated-state
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/factor-research-architecture
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Regenerate deterministic lockfile
        run: cargo generate-lockfile
      - name: Regenerate Python binding from FFI registry SSOT
        run: python scripts/sync_bindings.py --lang python --generate
      - name: Regenerate generated documentation SSOT
        run: python scripts/gen_ssot_docs.py --generate
      - name: Format workspace Rust
        run: cargo fmt --all
      - name: Verify normalized generated state
        run: |
          cargo fmt --all --check
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          python scripts/sync_bindings.py --lang python --check
          python scripts/gen_ssot_docs.py --check
      - name: Commit generated state only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock docs/generated ffi/python-binding/src/generated.rs
          git diff --name-only -- '*.rs' | xargs -r git add --
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh research generated state"
          git push origin HEAD:feat/factor-research-architecture
