name: Docs Check

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "core/**"
      - "ffi/**"
      - "visualization/**"
      - "examples/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "CHANGELOG.md"
      - "scripts/**"
      - ".github/workflows/*.yml"
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "core/**"
      - "ffi/**"
      - "visualization/**"
      - "examples/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "CHANGELOG.md"
      - "scripts/**"
      - ".github/workflows/*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify docs, generated SSOT and versions
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check release versions
        run: python scripts/check_versions.py
      - name: Check generated SSOT docs
        run: python scripts/gen_ssot_docs.py --check
      - name: Check local documentation links
        run: python scripts/check_docs_links.py
