name: PR29 artifact dataplane once

on:
  push:
    branches:
      - feat/factor-research-architecture
    paths:
      - .github/workflows/pr29-artifact-dataplane-once.yml

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Apply bounded architecture patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          api_path = Path("factor-analysis/src/api.rs")
          api = api_path.read_text()
          old_imports = "\n".join([
              "use crate::analysis::WeightConfig;",
              "use crate::data::{AssetId, GroupId, PanelIndex, ResearchFrame};",
              "use crate::error::ResearchError;",
              "use crate::performance::EvaluationConfig;",
              "use crate::prepare::QuantizeConfig;",
              "use crate::report::{AnalysisMode, FactorStudy, FactorStudyReport};",
          ])
          new_imports = "\n".join([
              "use crate::analysis::WeightConfig;",
              "use crate::context::ResearchContext;",
              "use crate::data::{AssetId, GroupId, PanelIndex, ResearchFrame};",
              "use crate::error::ResearchError;",
              "use crate::executor::ResearchExecutor;",
              "use crate::orchestration::StudyProvenance;",
              "use crate::performance::EvaluationConfig;",
              "use crate::policy::ResearchPolicy;",
              "use crate::prepare::QuantizeConfig;",
              "use crate::report::{AnalysisMode, FactorStudyReport};",
          ])
          api = replace_once(api, old_imports, new_imports, "api imports")
          api_start = api.index("    FactorStudy::new(&frame, \"factor\", \"price\", request.periods.clone())")
          api_end_marker = "\n}\n\n/// Execute a canonical request"
          api_end = api.index(api_end_marker, api_start)
          api_lines = [
              "    let policy = ResearchPolicy::new(",
              "        request.periods.clone(),",
              "        QuantizeConfig {",
              "            quantiles: request.quantiles,",
              "            by_group: request.quantize_by_group.then(|| \"group\".to_string()),",
              "            zero_aware: request.zero_aware,",
              "        },",
              "        WeightConfig {",
              "            demeaned: request.demeaned,",
              "            group_adjust: request.group_neutral.then(|| \"group\".to_string()),",
              "            equal_weight: request.equal_weight,",
              "        },",
              "        request.evaluation,",
              "        request.execution_lag,",
              "    )",
              "    .map_err(ResearchApiError::computation)?;",
              "    let context = ResearchContext::batch(",
              "        &frame,",
              "        policy,",
              "        StudyProvenance {",
              "            library_version: env!(\"CARGO_PKG_VERSION\").to_string(),",
              "            ..StudyProvenance::default()",
              "        },",
              "    )",
              "    .map_err(ResearchApiError::computation)?;",
              "",
              "    ResearchExecutor::execute_standard_context(",
              "        &context,",
              "        \"factor\",",
              "        \"price\",",
              "        request.mode,",
              "    )",
              "    .map(|result| result.report)",
              "    .map_err(ResearchApiError::computation)",
          ]
          api = api[:api_start] + "\n".join(api_lines) + api[api_end:]
          api_path.write_text(api)

          executor_path = Path("factor-analysis/src/executor.rs")
          executor = executor_path.read_text()
          old_state = "\n".join([
              "        let mut quality: Option<DataQualityReport> = None;",
              "        let mut forward: Option<BTreeMap<usize, Vec<f64>>> = None;",
              "        let mut daily_asset_returns: Option<Vec<f64>> = None;",
              "        let mut quantiles: Option<Vec<u16>> = None;",
              "        let mut weights: Option<Vec<f64>> = None;",
          ])
          new_state = "        let mut quality: Option<DataQualityReport> = None;"
          executor = replace_once(executor, old_state, new_state, "executor parallel state")

          def replace_stage(text, start_kind, next_kind, lines):
              start_marker = f"                ResearchStageKind::{start_kind} => {{\n"
              end_marker = f"                ResearchStageKind::{next_kind} => {{\n"
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              return text[:start] + "\n".join(lines) + "\n" + text[end:]

          executor = replace_stage(executor, "ForwardReturns", "Quantize", [
              "                ResearchStageKind::ForwardReturns => {",
              "                    let mut calculation_periods = request.periods.to_vec();",
              "                    if !calculation_periods.contains(&1) {",
              "                        calculation_periods.push(1);",
              "                    }",
              "                    calculation_periods.sort_unstable();",
              "                    calculation_periods.dedup();",
              "                    let config =",
              "                        ForwardReturnConfig::new(calculation_periods, ReturnKind::Arithmetic)?;",
              "                    let mut values =",
              "                        compute_forward_returns(request.frame, request.price_column, &config)?;",
              "                    let daily = values.get(&1).cloned().ok_or_else(|| {",
              "                        ResearchError::InvalidConfig(",
              "                            \"forward-return stage did not materialize one-day returns\"",
              "                                .to_string(),",
              "                        )",
              "                    })?;",
              "                    artifacts.insert(",
              "                        artifact_key(",
              "                            &request,",
              "                            plan_fingerprint,",
              "                            stage_id,",
              "                            \"daily_asset_returns\",",
              "                        ),",
              "                        ResearchArtifact::Series(daily),",
              "                    );",
              "                    if !request.periods.contains(&1) {",
              "                        values.remove(&1);",
              "                    }",
              "                    artifacts.insert(",
              "                        artifact_key(&request, plan_fingerprint, stage_id, \"forward_returns\"),",
              "                        ResearchArtifact::HorizonSeries(values),",
              "                    );",
              "                }",
          ])

          executor = replace_stage(executor, "Quantize", "Returns", [
              "                ResearchStageKind::Quantize => {",
              "                    let values =",
              "                        quantize_factor(request.frame, request.factor_column, request.quantize)?;",
              "                    artifacts.insert(",
              "                        artifact_key(&request, plan_fingerprint, stage_id, \"quantiles\"),",
              "                        ResearchArtifact::Quantiles(values),",
              "                    );",
              "                }",
          ])

          executor = replace_stage(executor, "Returns", "Information", [
              "                ResearchStageKind::Returns => {",
              "                    let forward_stage = dependency_stage_id(",
              "                        plan,",
              "                        &stage.dependencies,",
              "                        ResearchStageKind::ForwardReturns,",
              "                        stage.kind,",
              "                    )?;",
              "                    let quantize_stage = dependency_stage_id(",
              "                        plan,",
              "                        &stage.dependencies,",
              "                        ResearchStageKind::Quantize,",
              "                        stage.kind,",
              "                    )?;",
              "                    let forward_key = artifact_key(",
              "                        &request,",
              "                        plan_fingerprint,",
              "                        forward_stage,",
              "                        \"forward_returns\",",
              "                    );",
              "                    let quantile_key = artifact_key(",
              "                        &request,",
              "                        plan_fingerprint,",
              "                        quantize_stage,",
              "                        \"quantiles\",",
              "                    );",
              "                    let forward_ref = required_horizon_series(",
              "                        &artifacts,",
              "                        &forward_key,",
              "                        \"ForwardReturns\",",
              "                        stage.kind,",
              "                    )?;",
              "                    let quantile_ref = required_quantiles(",
              "                        &artifacts,",
              "                        &quantile_key,",
              "                        \"Quantize\",",
              "                        stage.kind,",
              "                    )?;",
              "                    let computed_weights =",
              "                        factor_weights(request.frame, request.factor_column, request.weights)?;",
              "                    let returns = factor_returns(request.frame, &computed_weights, forward_ref)?;",
              "                    let alpha = factor_alpha_beta(request.frame, &returns, forward_ref);",
              "                    let by_quantile = mean_return_by_quantile(quantile_ref, forward_ref);",
              "                    let diagnostics = quantile_diagnostics(&by_quantile);",
              "                    artifacts.insert(",
              "                        artifact_key(&request, plan_fingerprint, stage_id, \"factor_returns\"),",
              "                        ResearchArtifact::HorizonSeries(returns.clone()),",
              "                    );",
              "                    artifacts.insert(",
              "                        artifact_key(&request, plan_fingerprint, stage_id, \"weights\"),",
              "                        ResearchArtifact::Series(computed_weights),",
              "                    );",
              "                    factor_ret = Some(returns);",
              "                    alpha_beta = Some(alpha);",
              "                    quantile_returns = Some(by_quantile);",
              "                    quantile_diag = Some(diagnostics);",
              "                }",
          ])

          executor = replace_stage(executor, "Information", "Turnover", [
              "                ResearchStageKind::Information => {",
              "                    let forward_stage = dependency_stage_id(",
              "                        plan,",
              "                        &stage.dependencies,",
              "                        ResearchStageKind::ForwardReturns,",
              "                        stage.kind,",
              "                    )?;",
              "                    let forward_key = artifact_key(",
              "                        &request,",
              "                        plan_fingerprint,",
              "                        forward_stage,",
              "                        \"forward_returns\",",
              "                    );",
              "                    let forward_ref = required_horizon_series(",
              "                        &artifacts,",
              "                        &forward_key,",
              "                        \"ForwardReturns\",",
              "                        stage.kind,",
              "                    )?;",
              "                    let values =",
              "                        information_coefficient(request.frame, request.factor_column, forward_ref)?;",
              "                    let means = mean_information_coefficient(&values);",
              "                    let stats = values",
              "                        .iter()",
              "                        .map(|(&period, series)| {",
              "                            (period, summarize_ic(series, period.saturating_sub(1)))",
              "                        })",
              "                        .collect();",
              "                    artifacts.insert(",
              "                        artifact_key(",
              "                            &request,",
              "                            plan_fingerprint,",
              "                            stage_id,",
              "                            \"information_coefficient\",",
              "                        ),",
              "                        ResearchArtifact::HorizonSeries(values.clone()),",
              "                    );",
              "                    ic = Some(values);",
              "                    mean_ic = Some(means);",
              "                    ic_statistics = Some(stats);",
              "                }",
          ])

          executor = replace_stage(executor, "Turnover", "Portfolio", [
              "                ResearchStageKind::Turnover => {",
              "                    let quantize_stage = dependency_stage_id(",
              "                        plan,",
              "                        &stage.dependencies,",
              "                        ResearchStageKind::Quantize,",
              "                        stage.kind,",
              "                    )?;",
              "                    let quantile_key = artifact_key(",
              "                        &request,",
              "                        plan_fingerprint,",
              "                        quantize_stage,",
              "                        \"quantiles\",",
              "                    );",
              "                    let quantile_ref = required_quantiles(",
              "                        &artifacts,",
              "                        &quantile_key,",
              "                        \"Quantize\",",
              "                        stage.kind,",
              "                    )?;",
              "                    bottom_turnover = Some(quantile_turnover(request.frame, quantile_ref, 1, 1)?);",
              "                    top_turnover = Some(quantile_turnover(",
              "                        request.frame,",
              "                        quantile_ref,",
              "                        request.quantize.quantiles,",
              "                        1,",
              "                    )?);",
              "                    let autocorrelation =",
              "                        rank_autocorrelation(request.frame, request.factor_column, 1)?;",
              "                    artifacts.insert(",
              "                        artifact_key(&request, plan_fingerprint, stage_id, \"rank_autocorrelation\"),",
              "                        ResearchArtifact::Series(autocorrelation.clone()),",
              "                    );",
              "                    rank_auto = Some(autocorrelation);",
              "                }",
          ])

          executor = replace_stage(executor, "Portfolio", "Report", [
              "                ResearchStageKind::Portfolio => {",
              "                    let returns_stage = dependency_stage_id(",
              "                        plan,",
              "                        &stage.dependencies,",
              "                        ResearchStageKind::Returns,",
              "                        stage.kind,",
              "                    )?;",
              "                    let forward_stage = dependency_stage_id(",
              "                        plan,",
              "                        &stage.dependencies,",
              "                        ResearchStageKind::ForwardReturns,",
              "                        stage.kind,",
              "                    )?;",
              "                    let weights_key = artifact_key(",
              "                        &request,",
              "                        plan_fingerprint,",
              "                        returns_stage,",
              "                        \"weights\",",
              "                    );",
              "                    let daily_key = artifact_key(",
              "                        &request,",
              "                        plan_fingerprint,",
              "                        forward_stage,",
              "                        \"daily_asset_returns\",",
              "                    );",
              "                    let computed_weights = required_series(",
              "                        &artifacts,",
              "                        &weights_key,",
              "                        \"Returns weights\",",
              "                        stage.kind,",
              "                    )?;",
              "                    let daily = required_series(",
              "                        &artifacts,",
              "                        &daily_key,",
              "                        \"ForwardReturns daily returns\",",
              "                        stage.kind,",
              "                    )?;",
              "                    let value = evaluate_factor_holding_periods(",
              "                        request.frame,",
              "                        computed_weights,",
              "                        daily,",
              "                        request.periods,",
              "                        request.execution_lag,",
              "                        request.evaluation,",
              "                    )?;",
              "                    let cumulative = value",
              "                        .by_holding_period",
              "                        .iter()",
              "                        .map(|(&period, result)| (period, result.gross_cumulative_wealth.clone()))",
              "                        .collect();",
              "                    artifacts.insert(",
              "                        artifact_key(&request, plan_fingerprint, stage_id, \"cumulative_returns\"),",
              "                        ResearchArtifact::HorizonSeries(cumulative),",
              "                    );",
              "                    performance = Some(value);",
              "                }",
          ])

          helper_marker = "fn artifact_key(\n"
          helper_pos = executor.index(helper_marker)
          helper_lines = [
              "fn dependency_stage_id(",
              "    plan: &ResearchPlan,",
              "    dependencies: &[usize],",
              "    dependency_kind: ResearchStageKind,",
              "    stage: ResearchStageKind,",
              ") -> ResearchResult<usize> {",
              "    dependencies",
              "        .iter()",
              "        .copied()",
              "        .find(|&id| plan.stage(id).is_some_and(|spec| spec.kind == dependency_kind))",
              "        .ok_or_else(|| {",
              "            ResearchError::InvalidConfig(format!(",
              "                \"research stage {stage:?} requires dependency {dependency_kind:?}\"",
              "            ))",
              "        })",
              "}",
              "",
              "fn required_series<'a>(",
              "    artifacts: &'a ResearchArtifactStore,",
              "    key: &MaterializationKey,",
              "    dependency: &str,",
              "    stage: ResearchStageKind,",
              ") -> ResearchResult<&'a [f64]> {",
              "    artifacts",
              "        .get(key)",
              "        .and_then(ResearchArtifact::as_series)",
              "        .ok_or_else(|| {",
              "            ResearchError::InvalidConfig(format!(",
              "                \"research stage {stage:?} requires typed materialization {dependency}\"",
              "            ))",
              "        })",
              "}",
              "",
              "fn required_quantiles<'a>(",
              "    artifacts: &'a ResearchArtifactStore,",
              "    key: &MaterializationKey,",
              "    dependency: &str,",
              "    stage: ResearchStageKind,",
              ") -> ResearchResult<&'a [u16]> {",
              "    artifacts",
              "        .get(key)",
              "        .and_then(ResearchArtifact::as_quantiles)",
              "        .ok_or_else(|| {",
              "            ResearchError::InvalidConfig(format!(",
              "                \"research stage {stage:?} requires typed materialization {dependency}\"",
              "            ))",
              "        })",
              "}",
              "",
              "fn required_horizon_series<'a>(",
              "    artifacts: &'a ResearchArtifactStore,",
              "    key: &MaterializationKey,",
              "    dependency: &str,",
              "    stage: ResearchStageKind,",
              ") -> ResearchResult<&'a BTreeMap<usize, Vec<f64>>> {",
              "    artifacts",
              "        .get(key)",
              "        .and_then(ResearchArtifact::as_horizon_series)",
              "        .ok_or_else(|| {",
              "            ResearchError::InvalidConfig(format!(",
              "                \"research stage {stage:?} requires typed materialization {dependency}\"",
              "            ))",
              "        })",
              "}",
              "",
          ]
          executor = executor[:helper_pos] + "\n".join(helper_lines) + "\n" + executor[helper_pos:]

          test_marker = "        assert!(!result.artifacts.is_empty());\n"
          test_insert = "\n".join([
              "        assert!(!result.artifacts.is_empty());",
              "        let outputs = result",
              "            .artifacts",
              "            .iter()",
              "            .map(|(key, _)| key.output.as_str())",
              "            .collect::<Vec<_>>();",
              "        assert!(outputs.contains(&\"forward_returns\"));",
              "        assert!(outputs.contains(&\"daily_asset_returns\"));",
              "        assert!(outputs.contains(&\"quantiles\"));",
              "        assert!(outputs.contains(&\"weights\"));",
          ]) + "\n"
          executor = replace_once(executor, test_marker, test_insert, "artifact dataplane test")
          executor_path.write_text(executor)
          PY

      - name: Normalize formatting
        run: cargo fmt --all
      - name: Verify bounded diff
        shell: bash
        run: |
          git diff --check
          git diff --name-only | sort > /tmp/actual
          printf '%s\n' factor-analysis/src/api.rs factor-analysis/src/executor.rs | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          git diff --stat
      - name: Test factor research
        run: cargo test -p finkit-factor-analysis --locked
      - name: Clippy factor research
        run: cargo clippy -p finkit-factor-analysis --all-targets --locked -- -D warnings
      - name: Commit architecture convergence
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add factor-analysis/src/api.rs factor-analysis/src/executor.rs
          git commit -m 'refactor(research): make artifact store the execution data plane'
          git push origin HEAD:feat/factor-research-architecture
