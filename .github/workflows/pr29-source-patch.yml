name: PR29 exact source patch

on:
  push:
    branches:
      - feat/factor-research-architecture
    paths:
      - .github/workflows/pr29-source-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply exact source patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          cycle_path = Path("core/src/indicators/cycle.rs")
          cycle = cycle_path.read_text()
          start_marker = "    let dc_phase = dominant_cycle_phase(input, &period);\n    let deg2rad = std::f64::consts::PI / 180.0;\n"
          end_marker = "    Ok((sine, lead_sine))"
          if cycle.count(start_marker) != 1:
              raise SystemExit(f"expected one current HT_SINE start marker, found {cycle.count(start_marker)}")
          start = cycle.index(start_marker)
          end = cycle.index(end_marker, start)
          new_lines = [
              "    let dc_phase = dominant_cycle_phase(input, &period);",
              "    let deg2rad = std::f64::consts::PI / 180.0;",
              "    let phase_len = len - 63;",
              "    let mut phase_radians = vec![0.0_f64; phase_len];",
              "    let mut phase_cos_sign = vec![1.0_f64; phase_len];",
              "    let pi = std::f64::consts::PI;",
              "    let half_pi = std::f64::consts::FRAC_PI_2;",
              "    let two_pi = 2.0 * pi;",
              "    for (offset, value) in dc_phase[63..].iter().enumerate() {",
              "        let mut phase = (*value * deg2rad).rem_euclid(two_pi);",
              "        if phase > pi {",
              "            phase -= two_pi;",
              "        }",
              "        // Keep the AVX2 polynomial inside [-pi/2, pi/2], but remember",
              "        // the original cosine quadrant so lead-sine can reuse the same",
              "        // SIMD sin/cos evaluation instead of calling scalar sin again.",
              "        if phase > half_pi {",
              "            phase = pi - phase;",
              "            phase_cos_sign[offset] = -1.0;",
              "        } else if phase < -half_pi {",
              "            phase = -pi - phase;",
              "            phase_cos_sign[offset] = -1.0;",
              "        }",
              "        phase_radians[offset] = phase;",
              "    }",
              "    let mut phase_sin = vec![0.0_f64; len];",
              "    let mut phase_cos = vec![0.0_f64; phase_len];",
              "    simd_ops::simd_sin_cos(&phase_radians, &mut phase_sin[63..len], &mut phase_cos);",
              "",
              "    for i in 63..len {",
              "        let offset = i - 63;",
              "        let sin_phase = phase_sin[i];",
              "        let cos_phase = phase_cos[offset] * phase_cos_sign[offset];",
              "        sine[i] = sin_phase;",
              "        lead_sine[i] =",
              "            (sin_phase + cos_phase) * std::f64::consts::FRAC_1_SQRT_2;",
              "    }",
              "",
          ]
          cycle_path.write_text(cycle[:start] + "\n".join(new_lines) + "\n" + cycle[end:])

          go_path = Path("ffi/go-binding/go/ta/ta.go")
          go = go_path.read_text()
          old_go = "\t\tcInt(fastPeriod), cInt(fastMa), cInt(slowPeriod), cInt(slowMa), cInt(signalPeriod), cInt(signalMa),"
          new_go = "\t\tcInt(fastPeriod), cInt(int(fastMa)), cInt(slowPeriod), cInt(int(slowMa)), cInt(signalPeriod), cInt(int(signalMa)),"
          if go.count(old_go) != 1:
              raise SystemExit(f"expected exactly one Go MACDEXT ABI call, found {go.count(old_go)}")
          go_path.write_text(go.replace(old_go, new_go, 1))

          orchestration = Path("factor-analysis/src/orchestration.rs")
          text = orchestration.read_text()
          orchestration.write_text(text.rstrip("\n") + "\n")
          PY

      - name: Verify patch shape
        shell: bash
        run: |
          git diff --check
          git diff --stat
          expected="$(printf '%s\n' core/src/indicators/cycle.rs factor-analysis/src/orchestration.rs ffi/go-binding/go/ta/ta.go | sort)"
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"
          grep -F 'cInt(int(fastMa))' ffi/go-binding/go/ta/ta.go
          grep -F 'phase_cos_sign[offset]' core/src/indicators/cycle.rs

      - name: Commit exact source patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/src/indicators/cycle.rs factor-analysis/src/orchestration.rs ffi/go-binding/go/ta/ta.go
          git commit -m 'fix: close final hot-path and CGO release gaps'
          git push origin HEAD:feat/factor-research-architecture
