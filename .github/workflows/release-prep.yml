name: Release prep (temporary)

on:
  push:
    branches: [fix/v0.1.0-build]

permissions:
  contents: write

jobs:
  normalize:
    name: Format, generate and refresh lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Format all Rust sources
        run: cargo fmt --all
      - name: Regenerate registry snapshot
        run: cargo test -p finkit generate_indicator_registry_json -- --ignored
      - name: Refresh audited dependencies
        run: |
          cargo update -p crossbeam-epoch --precise 0.9.20
          cargo update -p lru --precise 0.18.3
          cargo update -p memmap2 --precise 0.9.11
          cargo update -p pyo3 --precise 0.29.2
          cargo update -p numpy --precise 0.29.0
      - name: Commit generated and normalized sources
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore: normalize release sources and audited lockfile"
          git push origin HEAD:fix/v0.1.0-build
