name: Apply performance remediation plan

on:
  push:
    branches:
      - fix/perf-contract-talib-parity-20260904
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ !contains(github.event.head_commit.message || '', '[perf-plan-generated]') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Apply migration
        run: python scripts/apply_perf_plan.py
      - name: Validate direct NumPy return contract
        run: |
          grep -q "PY_NUMPY_DIRECT_RETURN_V1" ffi/python-binding/src/generated.rs
          grep -q "PyArray1::from_vec" ffi/python-binding/src/generated.rs
          python - <<'PY'
          from pathlib import Path
          import re
          for path in [Path('ffi/python-binding/src/generated.rs'), Path('ffi/python-binding/src/lib.rs')]:
              text = path.read_text()
              bad = re.findall(r'#\[pyfunction\](?:.|\n){0,700}?fn\s+(?![A-Za-z0-9_]*_vec\b)[A-Za-z0-9_]+(?:.|\n){0,900}?->\s*PyResult\s*<\s*(?:Vec\s*<|\(\s*Vec\s*<)', text)
              if bad:
                  raise SystemExit(f'public Vec-return pyfunction remains in {path}: {len(bad)}')
          PY
      - name: Format and compile Python binding
        run: |
          cargo fmt --all
          cargo check -p finkit-python --all-features --locked
      - name: Commit generated migration
        run: |
          if git diff --quiet; then
            echo "No generated migration changes"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ffi/python-binding scripts/sync_bindings.py
          git commit -m "perf: apply NumPy direct-return migration [perf-plan-generated]"
          git push origin HEAD:${GITHUB_REF_NAME}
