name: v0.1.3 multilang prepare

on:
  push:
    branches: ["release/v0.1.3"]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.1.3
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Finalize multilang interfaces
        run: |
          set -euo pipefail
          python scripts/prepare_v013_multilang.py
          python scripts/prepare_v013_platform_compat.py
          python scripts/prepare_v013_node_package.py
          python scripts/prepare_v013_binding_fixes.py
          python scripts/check_versions.py
          git diff --check

      - name: Commit interface closure
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No interface changes remain"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ffi/c-binding/CMakeLists.txt \
                  ffi/c-binding/include/finkit.hpp \
                  ffi/c-binding/tests/CMakeLists.txt \
                  ffi/c-binding/examples/CMakeLists.txt \
                  ffi/java-binding/java/src/main/java/com/finkit/Indicators.java \
                  ffi/java-binding/java/src/main/java/com/finkit/NativeLoader.java \
                  ffi/node-binding/package.json \
                  scripts/check_versions.py
          git commit -m "fix: finalize v0.1.3 multilang interfaces"
          git push origin HEAD:release/v0.1.3
