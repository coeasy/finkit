name: Apply warning cleanup

on:
  push:
    branches:
      - "fix/arm-simd-dotnet-warning-cleanup"
    paths:
      - "scripts/_apply_warning_cleanup.py"
      - ".github/workflows/_apply-warning-cleanup.yml"

permissions:
  contents: write

concurrency:
  group: apply-warning-cleanup
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/arm-simd-dotnet-warning-cleanup
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply asserted source transformations
        run: python scripts/_apply_warning_cleanup.py
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Verify warning contracts and diff hygiene
        run: |
          python scripts/check_warning_contracts.py
          git diff --check
      - name: Verify stale binding generator fails closed
        shell: bash
        run: |
          set -euo pipefail
          set +e
          OUTPUT="$(python scripts/sync_bindings.py --check --lang dotnet 2>&1)"
          RC=$?
          set -e
          test "$RC" -ne 0
          grep -q "has no ffi metadata; refusing" <<< "$OUTPUT"
          printf '%s\n' "$OUTPUT"
      - name: Check host core and .NET without Rust warnings
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          cargo check -p finkit --locked
          cargo check -p finkit-dotnet --locked
      - name: Check AArch64 core without warnings
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check -p finkit --target aarch64-unknown-linux-gnu --locked
      - name: Commit cleanup result
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "cleanup produced no changes" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/formula/simd.rs \
                  core/src/indicators/statistics.rs \
                  scripts/sync_bindings.py \
                  ffi/*-binding/src/generated.rs
          git commit -m "fix: eliminate cross-platform compiler warnings"
          git push origin HEAD:fix/arm-simd-dotnet-warning-cleanup
