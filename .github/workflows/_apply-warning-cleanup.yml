name: Apply warning cleanup

on:
  push:
    branches:
      - "fix/arm-simd-dotnet-warning-cleanup"
    paths:
      - "scripts/_upgrade_action_refs.py"
      - ".github/workflows/_apply-warning-cleanup.yml"

permissions:
  contents: write

concurrency:
  group: apply-warning-cleanup
  cancel-in-progress: true

jobs:
  apply-action-upgrades:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/arm-simd-dotnet-warning-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Upgrade deprecated official Action references
        run: python scripts/_upgrade_action_refs.py
      - name: Verify deprecated Action references are gone
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -E 'actions/(checkout|setup-node|setup-java|setup-dotnet|upload-artifact|download-artifact|cache)@v4' .github/workflows --include='*.yml' --exclude='_apply-warning-cleanup.yml'
          ! grep -R -E 'actions/setup-python@v(5|6)' .github/workflows --include='*.yml' --exclude='_apply-warning-cleanup.yml'
          git diff --check
      - name: Commit workflow upgrades
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows; then
            echo "Action upgrade produced no workflow changes" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/*.yml
          git commit -m "ci: upgrade official GitHub Actions"
          git push origin HEAD:fix/arm-simd-dotnet-warning-cleanup
