name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  workspace-check:
    name: Workspace compile check
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check every workspace crate
        run: cargo check --workspace --all-targets --locked

  version-consistency:
    name: Version and warning consistency
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check release versions
        run: python scripts/check_versions.py
      - name: Check cross-platform warning contracts
        run: python scripts/check_warning_contracts.py

  fmt:
    name: Format
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (core)
        run: cargo clippy -p finkit --locked
      - name: Clippy (workspace)
        run: cargo clippy --workspace --all-targets --locked

  test:
    name: Test (core)
    needs: version-consistency
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify generated registry snapshot
        run: git diff --exit-code -- docs/indicator_registry.json
      - name: Run core tests
        run: cargo test -p finkit --locked
      - name: Run core docs tests
        run: cargo test -p finkit --doc --locked

  regression-gates:
    name: Memory and performance regression
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Zero-allocation hot-path contract
        run: cargo test -p finkit --test memory_regression --release --locked -- --test-threads=1
      - name: Relative performance contract
        run: cargo test -p finkit --test performance_regression --release --locked -- --test-threads=1
      - name: Compile benchmark suite
        run: cargo bench -p finkit --no-run --locked

  doc:
    name: Docs
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build docs
        run: cargo doc -p finkit --no-deps --locked

  audit:
    name: Dependency audit
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Other FFI bindings require their own language toolchains. Python wheel
  # builds and runtime tests run in python-wheels.yml across the matrix.
