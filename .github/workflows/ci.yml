name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  workspace-check:
    name: Workspace compile check
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check every workspace crate
        run: cargo check --workspace --all-targets --locked

  version-consistency:
    name: Version and warning consistency
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check release versions
        run: python scripts/check_versions.py
      - name: Check cross-platform warning contracts
        run: python scripts/check_warning_contracts.py

  fmt:
    name: Format
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (core)
        run: cargo clippy -p finkit --locked
      - name: Clippy (workspace)
        run: cargo clippy --workspace --all-targets --locked

  test:
    name: Test (core)
    needs: version-consistency
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify generated registry snapshot
        run: git diff --exit-code -- docs/indicator_registry.json
      - name: Run core tests with compiler warnings denied
        # The historical HT_SINE absolute throughput budget is enforced below
        # in release mode with one test thread. Keeping the debug wall-clock
        # probe in this highly concurrent job created false runner-jitter reds.
        run: cargo test -p finkit --locked -- --skip test_ht_sine_throughput
      - name: Run core docs tests
        run: cargo test -p finkit --doc --locked

  research-test:
    name: Factor research correctness and SSOT
    needs: version-consistency
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Enforce research single-source-of-truth ownership
        run: python scripts/check_research_ssot.py
      - name: Run factor-analysis unit, integration, invariant and doc tests
        run: cargo test -p finkit-factor-analysis --locked

  runtime-integration-tests:
    name: Runtime integration tests
    needs: version-consistency
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test CLI runtime and schema flow
        run: cargo test -p finkit-cli --locked
      - name: Test visualization integration flow
        run: cargo test -p finkit-visualization --locked
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Exercise generated GPU controller contract
        run: |
          cargo run -p finkit-visualization --features html --example gpu_large_chart --locked
          node scripts/test_webgl_runtime.mjs gpu_large_chart.html
          node scripts/test_webgl_runtime.mjs gpu_large_chart.html --webgpu
          cargo run -p finkit-visualization --features html --example improved_chart --locked
          node scripts/test_webgl_runtime.mjs improved_chart_webgpu.html
          node scripts/test_webgl_runtime.mjs improved_chart_webgpu.html --webgpu

  package-contract:
    name: Rust package contract
    needs: version-consistency
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify packaged core crate compiles from packaged contents
        run: cargo package -p finkit --locked
      - name: Build release CLI against the release core
        run: cargo build -p finkit-cli --release --locked

  regression-gates:
    name: Memory and performance regression
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Zero-allocation hot-path contract
        run: cargo test -p finkit --test memory_regression --release --locked -- --test-threads=1
      - name: Relative and absolute performance contracts
        run: cargo test -p finkit --test performance_regression --release --locked -- --test-threads=1
      - name: Compile benchmark suite with compiler warnings denied
        run: cargo bench -p finkit --no-run --locked

  doc:
    name: Docs
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build docs
        run: cargo doc -p finkit --no-deps --locked

  audit:
    name: Dependency audit
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Language-specific FFI runtime/package tests remain in python-wheels.yml,
  # multilang-release.yml, and multilang-cross-platform.yml where the required
  # native toolchains and platform runners are available.
