name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  workspace-check:
    name: Workspace compile check
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check every workspace crate
        run: cargo check --workspace --all-targets --locked

  version-consistency:
    name: Version and warning consistency
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check release versions
        run: python scripts/check_versions.py
      - name: Check cross-platform warning contracts
        run: python scripts/check_warning_contracts.py
      # Public modules that nothing calls rotted silently once before (see
      # docs/refactor-plan-2026-09-21.md §3-B). This fails on any unrecorded
      # orphan, and on any allowlist entry that is no longer orphaned, so the
      # recorded list can only shrink by deliberate edit.
      - name: Check for public modules with no callers
        run: python scripts/check_orphan_modules.py

  binding-ssot:
    name: Multi-language binding SSOT
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # `--check --all` must be green with NO `--allow-unchecked` escape hatch.
      # Tier-1 languages (Python, Node) are genuinely drift-checked against
      # stored bodies; the deferred languages report an explicit
      # `status=DEFERRED` rather than a vacuous `drift=none`, so a real gap can
      # never hide behind a passing job. See scripts/sync_bindings.py.
      - name: Verify binding bodies against the registry
        run: python scripts/sync_bindings.py --check --all
      # The NumPy-direct rewrite used to be checked only from
      # `apply-talib-performance-plan.yml`, whose `on:` covers a branch that is
      # no longer active -- so the check never ran and two binding modules
      # (`features.rs`, `transforms.rs`) silently kept their list-returning
      # wrappers. Check every binding source here, on the branches that matter.
      - name: Verify the Python bindings are NumPy-direct stable
        run: python scripts/optimize_python_bindings.py --check ffi/python-binding/src/*.rs
      # The `.pyi` stub ships inside the wheel and had rotted into declaring a
      # nonexistent `StreamingIndicator` base class and a nonexistent
      # `cdlhomingsoldier`. Static checks need no build; the strong
      # stub-vs-extension check runs in python-wheels.yml after a wheel exists.
      - name: Check the Python type stub contract
        run: python scripts/check_python_stub.py
      # The C header and the Rust `#[no_mangle] extern "C"` surface are two
      # halves of one ABI. `gen_binding.py` used to regenerate the Rust side
      # from `docs/indicator_registry.json`'s `ffi` block, but that metadata
      # moved to `docs/ffi_registry.json` and the generator now refuses to run,
      # so nothing kept the pair honest. This checks both directions across all
      # of `ffi/c-binding/src/*.rs` and `ffi/c-binding/include/*.h` -- including
      # the fixed-template entry points in `lib.rs` (`ta_version`,
      # `ta_last_error`, `ta_factor_execute_json`, ...) and the research surface
      # in `research.rs`, which the old generated-file-only check never saw.
      # `#[cfg(test)]`-gated exports are correctly ignored.
      - name: Check the C FFI header against the Rust exports
        run: python scripts/gen_c_header.py --check ffi/c-binding/include/finkit.h
      # Orphan automation is worse than missing automation: a `scripts/` file
      # with no consumer, or a workflow whose `on:` block can never match, reads
      # as a live gate while doing nothing. Both checks are dependency-free and
      # are also available locally via `make check-orphans`.
      - name: Check for orphan scripts
        run: python scripts/check_orphan_scripts.py
      - name: Check every workflow can actually be triggered
        run: python scripts/check_workflow_liveness.py

  fmt:
    name: Format
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Pinned, not `@stable`: rustfmt's output changes between releases, and a
      # floating toolchain turns this job red on someone else's schedule. Bump
      # it deliberately, then run `cargo fmt --all` locally with the same
      # toolchain so the committed formatting matches what this job checks.
      - uses: dtolnay/rust-toolchain@1.98
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (core)
        run: cargo clippy -p finkit --locked
      - name: Clippy (workspace)
        run: cargo clippy --workspace --all-targets --locked

  test:
    name: Test (core)
    needs: version-consistency
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify generated registry snapshot
        run: git diff --exit-code -- docs/indicator_registry.json
      - name: Run core tests with compiler warnings denied
        # The historical HT_SINE absolute throughput budget is enforced below
        # in release mode with one test thread. Keeping the debug wall-clock
        # probe in this highly concurrent job created false runner-jitter reds.
        run: cargo test -p finkit --locked -- --skip test_ht_sine_throughput
      - name: Run core docs tests
        run: cargo test -p finkit --doc --locked

  research-test:
    name: Factor research correctness and SSOT
    needs: version-consistency
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Enforce research single-source-of-truth ownership
        run: python scripts/check_research_ssot.py
      - name: Run factor-analysis unit, integration, invariant and doc tests
        run: cargo test -p finkit-factor-analysis --locked

  runtime-integration-tests:
    name: Runtime integration tests
    needs: version-consistency
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test CLI runtime and schema flow
        run: cargo test -p finkit-cli --locked
      - name: Test language-neutral FFI contracts
        run: cargo test -p finkit-ffi-common --locked
      - name: Test visualization integration flow
        run: cargo test -p finkit-visualization --locked
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Exercise generated GPU controller contract
        run: |
          cargo run -p finkit-visualization --features html --example gpu_large_chart --locked
          node scripts/test_webgl_runtime.mjs gpu_large_chart.html
          node scripts/test_webgl_runtime.mjs gpu_large_chart.html --webgpu
          cargo run -p finkit-visualization --features html --example improved_chart --locked
          node scripts/test_webgl_runtime.mjs improved_chart_webgpu.html
          node scripts/test_webgl_runtime.mjs improved_chart_webgpu.html --webgpu

  package-contract:
    name: Rust package contract
    needs: version-consistency
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify packaged core crate compiles from packaged contents
        run: cargo package -p finkit --locked
      # `cargo package` proves the crate compiles from its packaged contents,
      # but it does not validate publish-specific metadata (a readme path that
      # does not resolve inside the package, a keyword or category crates.io
      # rejects, a version already published). Those only surface on the tag,
      # which is the worst possible time to discover them.
      - name: Verify publish metadata without uploading
        run: cargo publish -p finkit --locked --dry-run
      - name: Build release CLI against the release core
        run: cargo build -p finkit-cli --release --locked

  regression-gates:
    name: Memory and performance regression
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Zero-allocation hot-path contract
        run: cargo test -p finkit --test memory_regression --release --locked -- --test-threads=1
      - name: Relative and absolute performance contracts
        run: cargo test -p finkit --test performance_regression --release --locked -- --test-threads=1
      - name: Compile benchmark suite with compiler warnings denied
        run: cargo bench -p finkit --no-run --locked

  doc:
    name: Docs
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `cargo doc` alone is not a gate: rustdoc lints are warn-by-default, so a
      # crate with broken intra-doc links still "builds". `RUSTFLAGS` does not
      # change that -- rustdoc reads `RUSTDOCFLAGS`. This script is the single
      # implementation of ADR 0011: it runs the same `cargo doc -p finkit
      # --no-deps --locked` under `RUSTDOCFLAGS="-D warnings"`, and also runs
      # locally via `make check-rustdoc`.
      - name: Enforce the rustdoc policy (ADR 0011)
        run: bash scripts/check_rustdoc.sh

  audit:
    name: Dependency audit
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Language-specific FFI runtime/package tests remain in python-wheels.yml,
  # multilang-release.yml, and multilang-cross-platform.yml where the required
  # native toolchains and platform runners are available.
