name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  workspace-check:
    name: Workspace compile check
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check every workspace crate
        run: cargo check --workspace --all-targets --locked

  version-consistency:
    name: Version and warning consistency
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check release versions
        run: python scripts/check_versions.py
      - name: Check cross-platform warning contracts
        run: python scripts/check_warning_contracts.py
      # Public modules that nothing calls rotted silently once before (see
      # docs/refactor-plan-2026-09-21.md §3-B). This fails on any unrecorded
      # orphan, and on any allowlist entry that is no longer orphaned, so the
      # recorded list can only shrink by deliberate edit.
      - name: Check for public modules with no callers
        run: python scripts/check_orphan_modules.py

  binding-ssot:
    name: Multi-language binding SSOT
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # `--check --all` must be green with NO `--allow-unchecked` escape hatch.
      # Tier-1 languages (Python, Node) are genuinely drift-checked against
      # stored bodies; the deferred languages report an explicit
      # `status=DEFERRED` rather than a vacuous `drift=none`, so a real gap can
      # never hide behind a passing job. See scripts/sync_bindings.py.
      - name: Verify binding bodies against the registry
        run: python scripts/sync_bindings.py --check --all
      # The NumPy-direct rewrite used to be checked only from
      # `apply-talib-performance-plan.yml`, whose `on:` covers a branch that is
      # no longer active -- so the check never ran and two binding modules
      # (`features.rs`, `transforms.rs`) silently kept their list-returning
      # wrappers. Check every binding source here, on the branches that matter.
      - name: Verify the Python bindings are NumPy-direct stable
        run: python scripts/optimize_python_bindings.py --check ffi/python-binding/src/*.rs
      # The `.pyi` stub ships inside the wheel and had rotted into declaring a
      # nonexistent `StreamingIndicator` base class and a nonexistent
      # `cdlhomingsoldier`. Static checks need no build; the strong
      # stub-vs-extension check runs in python-wheels.yml after a wheel exists.
      - name: Check the Python type stub contract
        run: python scripts/check_python_stub.py
      # The C header and the Rust `#[no_mangle] extern "C"` surface are two
      # halves of one ABI. `gen_binding.py` used to regenerate the Rust side
      # from `docs/indicator_registry.json`'s `ffi` block, but that metadata
      # moved to `docs/ffi_registry.json` and the generator now refuses to run,
      # so nothing kept the pair honest. This checks both directions across all
      # of `ffi/c-binding/src/*.rs` and `ffi/c-binding/include/*.h` -- including
      # the fixed-template entry points in `lib.rs` (`ta_version`,
      # `ta_last_error`, `ta_factor_execute_json`, ...) and the research surface
      # in `research.rs`, which the old generated-file-only check never saw.
      # `#[cfg(test)]`-gated exports are correctly ignored.
      - name: Check the C FFI header against the Rust exports
        run: python scripts/gen_c_header.py --check ffi/c-binding/include/finkit.h
      # The iOS binding has its own header and, until this check existed, no
      # equivalent gate. It had drifted: `finkit_ios_factor_study_json`,
      # `finkit_ios_factor_study_free_string` and
      # `finkit_ios_quant_evaluation_json` shipped without being declared, so a
      # plain C consumer of the iOS static library could not see that the
      # research and quant-evaluation entry points existed. The Swift wrappers
      # reach them via `@_silgen_name`, which is exactly why the drift was
      # invisible. `#[cfg(test)]`-gated exports are ignored.
      - name: Check the iOS FFI header against the Rust exports
        run: python scripts/check_ios_header_contract.py
      # `core/src/talib_ffi.rs` transcribes TA-Lib's `ta_func.h` for the
      # head-to-head benchmark. Three defects accumulated there because nothing
      # compared the transcription against the library: phantom declarations for
      # `TA_SKEWNESS`/`TA_KURTOSIS` (absent from every TA-Lib release, so they
      # never reached the linker and the benchmark stayed green), a "TA-Lib
      # 0.6.4" citation next to `TA_PERCENTRANK` (which 0.6.4 does not export),
      # and hand-written counts that agreed with neither the file nor each
      # other. The check is offline: it diffs against the committed
      # `talib_coverage_matrix_v1.json` catalog.
      - name: Check the TA-Lib transcription against the pinned TA-Lib catalog
        run: python scripts/check_talib_ffi_contract.py
      # Orphan automation is worse than missing automation: a `scripts/` file
      # with no consumer, or a workflow whose `on:` block can never match, reads
      # as a live gate while doing nothing. Both checks are dependency-free and
      # are also available locally via `make check-orphans`.
      - name: Check for orphan scripts
        run: python scripts/check_orphan_scripts.py
      - name: Check every workflow can actually be triggered
        run: python scripts/check_workflow_liveness.py
      # A `paths:` filter that omits a directory a built crate depends on lets a
      # breaking change to that dependency pass CI on the PR and only fail at
      # release time (e.g. wasm32 builds live only in multilang-release.yml).
      - name: Check workflow path filters cover built crate dependencies
        run: python scripts/check_workflow_path_coverage.py
      # Documents have the same failure mode. `docs/formula-talib-contract.md`
      # and `docs/quant-evaluation.md` were both current documents with zero
      # inbound references anywhere in the repository, so the documentation
      # index could not reach them. Also part of `make check-orphans`.
      - name: Check every document is reachable from another document
        run: python scripts/check_orphan_docs.py
      # `#[allow(dead_code)]` disables the one compiler check that can see
      # orphan logic, so an item behind it is invisible to every build and test.
      # A suppression with no stated reason is indistinguishable from a
      # function that was never wired up, which is exactly what five of them
      # turned out to be. Require a `// why` next to each one.
      - name: Check every dead_code suppression states a reason
        run: python scripts/check_dead_code_allows.py
      # The inverse break: a caller that names a script which is not in the
      # tree. A workflow step, Makefile recipe or document that invokes a
      # script which is not there has a
      # name, a place in the release checklist and often a paragraph
      # explaining what it enforces -- and no implementation. One workflow used
      # to write a hidden script at run time, execute it and delete it, so its
      # own command line pointed at a file that never existed in the tree.
      # `make check-script-refs`.
      - name: Check every `scripts/` reference resolves
        run: python scripts/check_script_references.py
      # The Windows MSI and the portable native archive describe one payload
      # from two files. They are checked together here rather than at release
      # time: discovering during a tag build that the Windows installer would
      # ship a different SDK from every other platform is too late to fix
      # cheaply, and too easy to wave through to hit a date.
      - name: Check the MSI payload matches the native archive
        run: python scripts/check_installer_contract.py
      # `f64::partial_cmp` returns `None` on NaN, so `partial_cmp(..).unwrap()`
      # panics on a gap value instead of propagating NaN -- the opposite of this
      # codebase's `null_policy: "nan"` convention. 45 such sites had
      # accumulated in the chart-pattern and percentile paths. `total_cmp` is
      # the NaN-safe house style; this gate keeps the outliers from returning.
      # Also `make check-nan-safety`.
      - name: Check float ordering is NaN-safe
        run: python scripts/check_nan_unsafe_ordering.py
      # V4 plan §3.2/P1-02: `check_orphan_modules.py` cannot see a tracked
      # `.rs` file that no module declaration references at all — exactly how
      # `core/src/circuit_breaker.rs` rotted. This walks the module graph from
      # every crate root instead. Also `make check-source-reachability`.
      - name: Check every Rust source enters the module graph
        run: python scripts/check_rust_source_reachability.py
      # V4 plan §3.3/P1-03: 273 Criterion report files under
      # `core/target/criterion` were once tracked despite `.gitignore`
      # (tracked-before-ignored stays tracked). Benchmark output belongs in
      # CI artifacts, not the source tree or release archives.
      - name: Check no build output is tracked
        run: python scripts/check_no_tracked_build_artifacts.py
      # V4 plan §5.2/P1-07: termination of `loop {` / `while true {` sites was
      # re-verified by hand each audit. This makes the review permanent: every
      # unbounded loop needs a SAFETY-TERMINATION argument, a break + budget
      # signal, or a recorded allowlist entry. Also `make check-loop-termination`.
      - name: Check every unbounded loop states a termination argument
        run: python scripts/check_unbounded_loops.py

  fmt:
    name: Format
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Pinned, not `@stable`: rustfmt's output changes between releases, and a
      # floating toolchain turns this job red on someone else's schedule. Bump
      # it deliberately, then run `cargo fmt --all` locally with the same
      # toolchain so the committed formatting matches what this job checks.
      - uses: dtolnay/rust-toolchain@1.98
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      # Turns `#[expect(lint)]` from a comment into a gate. This job carries
      # thousands of legacy clippy warnings on purpose and so cannot use
      # `-D warnings`; denying exactly this one lint keeps that tolerance while
      # making "the suppression you wrote no longer suppresses anything" fail
      # the build. `#[allow]` cannot express that at all, which is how a stale
      # `#[allow(clippy::uninit_vec)]` outlived the `set_len` it was granting
      # (V4 plan §29.3). Under plain `cargo check` the expectation is not
      # evaluated for tool lints, so this does not affect the other jobs.
      RUSTFLAGS: "-D unfulfilled_lint_expectations"
    steps:
      - uses: actions/checkout@v7
      # Pinned, not `@stable`: clippy turns new lints on without warning, and
      # `approx_constant` on the Euler–Mascheroni constant in
      # factor-analysis turned a green tree red with zero code changes (V4
      # plan §5.4/§5.5). The canonical channel is `rust-toolchain.toml`;
      # future-compatibility lints are tracked by a separate non-blocking job.
      - uses: dtolnay/rust-toolchain@1.98
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (core)
        run: cargo clippy -p finkit --locked
      - name: Clippy (workspace)
        run: cargo clippy --workspace --all-targets --locked

  test:
    name: Test (core)
    needs: version-consistency
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A bare `git diff --exit-code` on a fresh checkout can never fail: nothing
      # in this job writes the file, so the step only looked like a gate. Run the
      # `#[ignore]`d generator first, then require its output to be byte-identical
      # to what is committed. That is the property we actually care about — the
      # committed snapshot is a fixed point of the generator — and it now fails
      # when the registry changes without regenerating `docs/`.
      - name: Verify generated registry snapshot
        run: |
          cargo test -p finkit --locked --lib -- --ignored generate_indicator_registry_json
          git diff --exit-code -- docs/indicator_registry.json
      - name: Run core tests with compiler warnings denied
        # The historical HT_SINE absolute throughput budget is enforced below
        # in release mode with one test thread. Keeping the debug wall-clock
        # probe in this highly concurrent job created false runner-jitter reds.
        run: cargo test -p finkit --locked -- --skip test_ht_sine_throughput
      - name: Run core docs tests
        run: cargo test -p finkit --doc --locked

  research-test:
    name: Factor research correctness and SSOT
    needs: version-consistency
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Enforce research single-source-of-truth ownership
        run: python scripts/check_research_ssot.py
      - name: Report indicator coverage across registry / streaming / batch
        # Measurement, not a gate: this prints how much of the registry is
        # reachable through each execution model so the trend stays visible. It
        # lives here because a coverage report nobody runs rots into the same
        # kind of orphan it was written to find -- it previously had no CI
        # caller at all, so its numbers were always somebody's stale local run.
        run: python scripts/check_coverage.py --json
      - name: Run factor-analysis unit, integration, invariant and doc tests
        run: cargo test -p finkit-factor-analysis --locked

  runtime-integration-tests:
    name: Runtime integration tests
    needs: version-consistency
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test CLI runtime and schema flow
        run: cargo test -p finkit-cli --locked
      - name: Test language-neutral FFI contracts
        run: cargo test -p finkit-ffi-common --locked
      # The C binding carries 31 `#[test]` functions of its own. Nothing ran
      # them: `multilang-release.yml` built `finkit-ffi` and drove the C/C++
      # `ctest` suite, but never `cargo test -p finkit-ffi`, so the crate's Rust
      # unit tests were dead in CI. `ffi-common` above is a different crate.
      - name: Test the C binding's Rust unit tests
        run: cargo test -p finkit-ffi --locked
      - name: Test visualization integration flow
        run: cargo test -p finkit-visualization --locked
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Exercise generated GPU controller contract
        run: |
          cargo run -p finkit-visualization --features html --example gpu_large_chart --locked
          node scripts/test_webgl_runtime.mjs gpu_large_chart.html
          node scripts/test_webgl_runtime.mjs gpu_large_chart.html --webgpu
          cargo run -p finkit-visualization --features html --example improved_chart --locked
          node scripts/test_webgl_runtime.mjs improved_chart_webgpu.html
          node scripts/test_webgl_runtime.mjs improved_chart_webgpu.html --webgpu

  binding-unit-tests:
    name: Binding crate unit tests
    needs: version-consistency
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `multilang-release.yml` builds every one of these crates and runs their
      # *language-level* test suites (go test, dotnet test, ctest, ...), but it
      # never ran `cargo test` on them. Their Rust-side `#[test]` functions --
      # the ones that exercise the FFI boundary directly, without a language
      # runtime in the way -- were therefore compiled and never executed.
      - name: Test the binding crates CI only compiles
        run: |
          cargo test \
            -p finkit-go \
            -p finkit-dotnet \
            -p finkit-java \
            -p finkit-android \
            -p finkit-ios \
            -p finkit-wasm \
            --locked --no-fail-fast

  package-contract:
    name: Rust package contract
    needs: version-consistency
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify packaged core crate compiles from packaged contents
        run: cargo package -p finkit --locked
      # `cargo package` proves the crate compiles from its packaged contents,
      # but it does not validate publish-specific metadata (a readme path that
      # does not resolve inside the package, a keyword or category crates.io
      # rejects, a version already published). Those only surface on the tag,
      # which is the worst possible time to discover them.
      - name: Verify publish metadata without uploading
        run: cargo publish -p finkit --locked --dry-run
      - name: Build release CLI against the release core
        run: cargo build -p finkit-cli --release --locked

  regression-gates:
    name: Memory and performance regression
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Zero-allocation hot-path contract
        run: cargo test -p finkit --test memory_regression --release --locked -- --test-threads=1
      - name: Relative and absolute performance contracts
        run: cargo test -p finkit --test performance_regression --release --locked -- --test-threads=1
      - name: Compile benchmark suite with compiler warnings denied
        run: cargo bench -p finkit --no-run --locked

  doc:
    name: Docs
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `cargo doc` alone is not a gate: rustdoc lints are warn-by-default, so a
      # crate with broken intra-doc links still "builds". `RUSTFLAGS` does not
      # change that -- rustdoc reads `RUSTDOCFLAGS`. This script is the single
      # implementation of ADR 0011: it runs the same `cargo doc -p finkit
      # --no-deps --locked` under `RUSTDOCFLAGS="-D warnings"`, and also runs
      # locally via `make check-rustdoc`.
      - name: Enforce the rustdoc policy (ADR 0011)
        run: bash scripts/check_rustdoc.sh

  audit:
    name: Dependency audit
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Language-specific FFI runtime/package tests remain in python-wheels.yml,
  # multilang-release.yml, and multilang-cross-platform.yml where the required
  # native toolchains and platform runners are available.

  # V4 plan §8.4 / P1-04, extended by Batch 2 (§24): the Python wheel build once
  # reached its shipping shape by rewriting tracked source in-place, so a plain
  # workspace compile was NOT proof the shipped tree compiles — all four wheel
  # platforms failed on `u16` vs `"var"` while the workspace stayed green.
  #
  # Batch 2 landed the canonical state in the tree and reduced the preparation
  # to verify + generate. This job now proves three things: the tree matches
  # `scripts/binding_spec.py`, the preparation writes nothing to hand-written
  # source, and the resulting tree compiles and is formatted.
  python-build-state:
    name: Python build-state gate
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98
      - uses: Swatinem/rust-cache@v2
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # The declarative contract. Runs first so drift costs seconds instead of
      # four platform wheel builds. Also `make verify-python-bindings`.
      - name: Verify the Python binding spec
        run: python scripts/verify_python_bindings.py
      # Generator idempotence: running preparation twice must not change the
      # tree further.
      - name: Run the Python build preparation (1st pass)
        run: python scripts/prepare_python_hot_bindings.py
      - name: Run the Python build preparation (2nd pass)
        run: python scripts/prepare_python_hot_bindings.py
      # The preparation refuses to write hand-written source and checks a
      # content fingerprint of every such file before and after it runs, so a
      # clean `git diff` here additionally proves nothing leaked through.
      - name: Verify the preparation is idempotent and wrote no source
        run: git diff --exit-code --stat
      - name: Check the generated binding tree compiles
        run: cargo check -p finkit-python --locked
      - name: Test the generated binding tree
        run: cargo test -p finkit-python --locked
      - name: Check the generated binding tree is formatted
        run: cargo fmt --all -- --check
      # Defensive net: no leftover conflict markers or whitespace damage.
      - name: Check for transformation damage
        run: git diff --check

  # V4 plan §5.5, lane 3 (future compatibility): moving `stable` is allowed to
  # warn but never blocks. New deny lints surface here first and get handled
  # in a deliberate change, instead of randomly red-lighting canonical CI.
  future-compat:
    name: Future toolchain compatibility (non-blocking)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy on moving stable (advisory)
        run: cargo clippy --workspace --all-targets --locked
