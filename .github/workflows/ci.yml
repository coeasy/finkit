name: CI

on:
  push:
    branches: [main, fix/contract-and-ci-hardening-v012]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  repair-pr13:
    name: Repair PR 13 slice migration
    if: github.event_name == 'push' && github.ref_name == 'fix/contract-and-ci-hardening-v012' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply targeted compile repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch_function(text, name, replacements):
              marker = f"fn {name}("
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f"missing function {name}")
              end = text.find("\nfn ", start + len(marker))
              if end < 0:
                  end = len(text)
              block = text[start:end]
              for old, new in replacements:
                  if old not in block:
                      raise SystemExit(f"missing target in {name}: {old!r}")
                  block = block.replace(old, new, 1)
              return text[:start] + block + text[end:]

          path = Path("core/src/formula/functions.rs")
          text = path.read_text()
          for name in ("fn_midprice", "fn_stoch", "fn_kdj_line", "fn_cmf", "fn_fisher", "fn_fisher_signal", "fn_chop"):
              text = patch_function(text, name, [
                  ("    let high_values = high;", "    let high_values = high.as_slice().unwrap();"),
                  ("    let low_values = low;", "    let low_values = low.as_slice().unwrap();"),
              ])
          for old, new in {
              "crate::indicators::momentum::dx(high, low, close.as_slice().unwrap(), n)": "crate::indicators::momentum::dx(high, low, close, n)",
              "crate::indicators::momentum::plus_di(high, low, close.as_slice().unwrap(), n)": "crate::indicators::momentum::plus_di(high, low, close, n)",
              "crate::indicators::momentum::minus_di(high, low, close.as_slice().unwrap(), n)": "crate::indicators::momentum::minus_di(high, low, close, n)",
              "crate::indicators::momentum::adxr(high, low, close.as_slice().unwrap(), n)": "crate::indicators::momentum::adxr(high, low, close, n)",
              "lib_momentum::ultosc(high, low, close.as_slice().unwrap(), p1, p2, p3)": "lib_momentum::ultosc(high.as_slice().unwrap(), low.as_slice().unwrap(), close.as_slice().unwrap(), p1, p2, p3)",
              "lib_momentum::plus_dm(high, low)": "lib_momentum::plus_dm(high.as_slice().unwrap(), low.as_slice().unwrap())",
              "lib_momentum::minus_dm(high, low)": "lib_momentum::minus_dm(high.as_slice().unwrap(), low.as_slice().unwrap())",
          }.items():
              if old not in text:
                  raise SystemExit(f"missing call target: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path("core/src/formula/types.rs")
          text = path.read_text()
          old = ".and_then(|value| value.as_slice().ok())"
          if text.count(old) != 3:
              raise SystemExit(f"expected 3 Option::ok sites, found {text.count(old)}")
          path.write_text(text.replace(old, ".and_then(|value| value.as_slice())"))

          path = Path("core/src/formula/optimizer.rs")
          text = path.read_text()
          old = "fn max_children<'a, I>(children: I) -> Option<usize>"
          if old not in text:
              raise SystemExit("max_children signature changed")
          path.write_text(text.replace(old, "fn max_children<'a, I>(mut children: I) -> Option<usize>", 1))

          path = Path("core/src/factors.rs")
          text = path.read_text()
          old = '''        if let Some(dependency) = factor
              .dependencies
              .iter()
              .find(|dependency| dependency.trim().is_empty())
          {'''
          new = '''        if factor
              .dependencies
              .iter()
              .any(|dependency| dependency.trim().is_empty())
          {'''
          if old not in text:
              raise SystemExit("factor validation target changed")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format and verify
        run: |
          cargo fmt --all
          cargo check --workspace --all-targets --locked
      - name: Commit source repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/formula/functions.rs core/src/formula/types.rs core/src/formula/optimizer.rs core/src/factors.rs
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "fix: repair slice migration compile regressions"
          git push origin HEAD:${GITHUB_REF_NAME}

  workspace-check:
    name: Workspace compile check
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check every workspace crate
        run: cargo check --workspace --all-targets --locked

  version-consistency:
    name: Version consistency
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check release versions
        run: python scripts/check_versions.py

  fmt:
    name: Format
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (core)
        run: cargo clippy -p finkit --locked
      - name: Clippy (workspace, advisory)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --locked

  test:
    name: Test (core)
    needs: version-consistency
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify generated registry snapshot
        run: git diff --exit-code -- docs/indicator_registry.json
      - name: Run core tests
        run: cargo test -p finkit --locked
      - name: Run core docs tests
        run: cargo test -p finkit --doc --locked

  doc:
    name: Docs
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build docs
        run: cargo doc -p finkit --no-deps --locked

  audit:
    name: Dependency audit
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
