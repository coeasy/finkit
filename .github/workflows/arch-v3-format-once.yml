name: Architecture v3 format once

on:
  push:
    branches:
      - perf/outperform-talib-v3-20260904

permissions:
  contents: write

concurrency:
  group: architecture-v3-format-once
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/outperform-talib-v3-20260904
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format workspace
        run: cargo fmt --all
      - name: Commit format-only changes
        run: |
          if git diff --quiet; then
            echo 'Already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'style: apply rustfmt to Architecture v3 branch'
          git push origin HEAD:perf/outperform-talib-v3-20260904
