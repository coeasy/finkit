name: PR14 factor format repair

on:
  push:
    branches:
      - feat/compute-runtime-factorplan-v012

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/compute-runtime-factorplan-v012
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit formatting changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core
          git commit -m "style: apply rustfmt to borrowed factor runtime"
          git push origin HEAD:feat/compute-runtime-factorplan-v012
