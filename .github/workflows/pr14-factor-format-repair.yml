name: PR14 factor format repair

on:
  push:
    branches:
      - feat/compute-runtime-factorplan-v012

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/compute-runtime-factorplan-v012
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Make factor equivalence assertion NaN-aware
        shell: python
        run: |
          from pathlib import Path

          path = Path("core/src/factors.rs")
          source = path.read_text(encoding="utf-8")
          old = "        assert_eq!(borrowed_result, owned_result);\n"
          new = """        assert!(borrowed_result\n            .iter()\n            .zip(&owned_result)\n            .all(|(left, right)| (left.is_nan() && right.is_nan()) || left == right));\n"""
          if old not in source:
              raise SystemExit("expected borrowed/owned equality assertion was not found")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit test and formatting changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core
          git commit -m "test: compare borrowed factor results with NaN semantics"
          git push origin HEAD:feat/compute-runtime-factorplan-v012
