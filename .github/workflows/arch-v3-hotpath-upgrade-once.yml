name: Architecture v3 hot-path upgrade once

on:
  push:
    branches:
      - perf/outperform-talib-v3-20260904

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/outperform-talib-v3-20260904
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply Architecture v3 hot-path changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          sync = Path("scripts/sync_bindings.py")
          text = sync.read_text(encoding="utf-8")
          marker = "from pathlib import Path\n"
          if "from optimize_python_bindings import optimize_source as optimize_python_source" not in text:
              if marker not in text:
                  raise SystemExit("sync_bindings.py import anchor missing")
              text = text.replace(
                  marker,
                  marker + "from optimize_python_bindings import optimize_source as optimize_python_source\n",
                  1,
              )
          old_emit = '    return header + "\\n".join(bodies) + "\\n"\n'
          new_emit = (
              '    text = header + "\\n".join(bodies) + "\\n"\n'
              '    if lang == "python":\n'
              '        text, _ = optimize_python_source(text)\n'
              '    return text\n'
          )
          if old_emit in text:
              text = text.replace(old_emit, new_emit, 1)
          elif new_emit not in text:
              raise SystemExit("sync_bindings.py emit anchor missing")

          check_anchor = "    for lang in langs:\n        cfg = LANG_CFG[lang]\n        src = (ROOT / cfg[\"lib\"]).read_text(encoding=\"utf-8\")\n"
          check_replacement = (
              "    for lang in langs:\n"
              "        cfg = LANG_CFG[lang]\n"
              "        if lang == \"python\":\n"
              "            gen_path = ROOT / cfg[\"gen\"]\n"
              "            expected = emit_generated(lang, inds)\n"
              "            actual = gen_path.read_text(encoding=\"utf-8\") if gen_path.exists() else \"\"\n"
              "            if actual != expected:\n"
              "                print(f\"[check/{lang}] generated binding drift\")\n"
              "                rc = 1\n"
              "            else:\n"
              "                print(f\"[check/{lang}] NumPy-direct generated binding OK\")\n"
              "            continue\n"
              "        src = (ROOT / cfg[\"lib\"]).read_text(encoding=\"utf-8\")\n"
          )
          if check_anchor in text:
              text = text.replace(check_anchor, check_replacement, 1)
          elif "NumPy-direct generated binding OK" not in text:
              raise SystemExit("sync_bindings.py check anchor missing")
          sync.write_text(text, encoding="utf-8")

          formula = Path("ffi/python-binding/src/formula_plan.rs")
          text = formula.read_text(encoding="utf-8")
          old_enum = '''enum CanonicalFormula {
              Atr { period: usize },
              Std { period: usize },
              Boll { period: usize, nbdev: f64 },
          }'''
          new_enum = '''enum CanonicalFormula {
              Sma { period: usize },
              Ema { period: usize },
              Rsi { period: usize },
              Mom { period: usize },
              Roc { period: usize },
              Atr { period: usize },
              Std { period: usize },
              Boll { period: usize, nbdev: f64 },
          }'''
          if old_enum in text:
              text = text.replace(old_enum, new_enum, 1)
          elif new_enum not in text:
              raise SystemExit("formula canonical enum anchor missing")

          atr_arm = '''        "ATR" if args.len() == 4 && is_high(args[0]) && is_low(args[1]) && is_close(args[2]) => {
                      let period = args[3].parse::<usize>().ok()?;
                      (period > 0).then_some(CanonicalFormula::Atr { period })
                  }'''
          prefix_arms = '''        "MA" | "SMA" if args.len() == 2 && is_close(args[0]) => {
                      let period = args[1].parse::<usize>().ok()?;
                      (period > 0).then_some(CanonicalFormula::Sma { period })
                  }
                  "EMA" if args.len() == 2 && is_close(args[0]) => {
                      let period = args[1].parse::<usize>().ok()?;
                      (period > 0).then_some(CanonicalFormula::Ema { period })
                  }
                  "RSI" if args.len() == 2 && is_close(args[0]) => {
                      let period = args[1].parse::<usize>().ok()?;
                      (period > 0).then_some(CanonicalFormula::Rsi { period })
                  }
                  "MOM" if args.len() == 2 && is_close(args[0]) => {
                      let period = args[1].parse::<usize>().ok()?;
                      (period > 0).then_some(CanonicalFormula::Mom { period })
                  }
                  "ROC" if args.len() == 2 && is_close(args[0]) => {
                      let period = args[1].parse::<usize>().ok()?;
                      (period > 0).then_some(CanonicalFormula::Roc { period })
                  }
          ''' + atr_arm
          if atr_arm in text and "CanonicalFormula::Roc" not in text:
              text = text.replace(atr_arm, prefix_arms, 1)
          elif "CanonicalFormula::Roc" not in text:
              raise SystemExit("formula canonical match anchor missing")

          eval_anchor = '''    match formula {
                  CanonicalFormula::Atr { period } => ::finkit::indicators::atr(high, low, close, period)'''
          eval_replacement = '''    match formula {
                  CanonicalFormula::Sma { period } => ::finkit::indicators::sma(close, period)
                      .map_err(|error| PyErr::new::<pyo3::exceptions::PyRuntimeError, _>(error.to_string())),
                  CanonicalFormula::Ema { period } => ::finkit::indicators::ema(close, period)
                      .map_err(|error| PyErr::new::<pyo3::exceptions::PyRuntimeError, _>(error.to_string())),
                  CanonicalFormula::Rsi { period } => ::finkit::indicators::rsi(close, period)
                      .map_err(|error| PyErr::new::<pyo3::exceptions::PyRuntimeError, _>(error.to_string())),
                  CanonicalFormula::Mom { period } => ::finkit::indicators::mom(close, period)
                      .map_err(|error| PyErr::new::<pyo3::exceptions::PyRuntimeError, _>(error.to_string())),
                  CanonicalFormula::Roc { period } => ::finkit::indicators::roc(close, period)
                      .map_err(|error| PyErr::new::<pyo3::exceptions::PyRuntimeError, _>(error.to_string())),
                  CanonicalFormula::Atr { period } => ::finkit::indicators::atr(high, low, close, period)'''
          if eval_anchor in text:
              text = text.replace(eval_anchor, eval_replacement, 1)
          elif "CanonicalFormula::Sma { period } =>" not in text:
              raise SystemExit("formula canonical eval anchor missing")
          text = text.replace(
              "Simple ATR/STD/BOLL formulas reuse the exact same canonical kernels as",
              "Canonical MA/EMA/RSI/MOM/ROC/ATR/STD/BOLL formulas reuse the exact same kernels as",
          )
          formula.write_text(text, encoding="utf-8")

          stats = Path("core/src/math/statistics.rs")
          text = stats.read_text(encoding="utf-8")
          extrema_anchor = "/// Find maximum value in a rolling window\n"
          extrema_impl = '''/// Visit fused rolling maximum/minimum values without materializing extrema arrays.
          ///
          /// Architecture v3 consumers use this kernel to share one rolling-window
          /// traversal across MIDPOINT/MIDPRICE/WILLR and related indicator families.
          /// The callback is monomorphized, so the hot loop contains no dynamic dispatch.
          #[inline]
          pub(crate) fn rolling_minmax_visit(
              high: &[f64],
              low: &[f64],
              window: usize,
              mut emit: impl FnMut(usize, f64, f64),
          ) {
              debug_assert_eq!(high.len(), low.len());
              debug_assert!(window > 0);

              let mut max_deque = std::collections::VecDeque::with_capacity(window + 1);
              let mut min_deque = std::collections::VecDeque::with_capacity(window + 1);

              for i in 0..high.len() {
                  while let Some(&back) = max_deque.back() {
                      if high[back] <= high[i] {
                          max_deque.pop_back();
                      } else {
                          break;
                      }
                  }
                  max_deque.push_back(i);

                  while let Some(&back) = min_deque.back() {
                      if low[back] >= low[i] {
                          min_deque.pop_back();
                      } else {
                          break;
                      }
                  }
                  min_deque.push_back(i);

                  while max_deque.front().is_some_and(|front| *front + window <= i) {
                      max_deque.pop_front();
                  }
                  while min_deque.front().is_some_and(|front| *front + window <= i) {
                      min_deque.pop_front();
                  }

                  if i + 1 >= window {
                      let highest = high[*max_deque.front().expect("rolling max is non-empty")];
                      let lowest = low[*min_deque.front().expect("rolling min is non-empty")];
                      emit(i, highest, lowest);
                  }
              }
          }

          '''
          if "pub(crate) fn rolling_minmax_visit" not in text:
              if extrema_anchor not in text:
                  raise SystemExit("statistics extrema anchor missing")
              text = text.replace(extrema_anchor, extrema_impl + extrema_anchor, 1)
          stats.write_text(text, encoding="utf-8")

          overlap = Path("core/src/indicators/overlap.rs")
          text = overlap.read_text(encoding="utf-8")
          text = text.replace(
              "use crate::math::statistics::{rolling_max, rolling_min};",
              "use crate::math::statistics::rolling_minmax_visit;",
              1,
          )
          old_midpoint = '''    let max = rolling_max(input, period)?;
              let min = rolling_min(input, period)?;

              let len = input.len();
              let mut output = init_output(len);

              for i in 0..len {
                  if !max[i].is_nan() && !min[i].is_nan() {
                      output[i] = (max[i] + min[i]) / 2.0;
                  }
              }

              Ok(output)'''
          new_midpoint = '''    let mut output = init_output(input.len());
              rolling_minmax_visit(input, input, period, |i, highest, lowest| {
                  output[i] = (highest + lowest) * 0.5;
              });
              Ok(output)'''
          if old_midpoint in text:
              text = text.replace(old_midpoint, new_midpoint, 1)
          elif "rolling_minmax_visit(input, input, period" not in text:
              raise SystemExit("midpoint anchor missing")

          old_midprice = '''    let max = rolling_max(high, period)?;
              let min = rolling_min(low, period)?;

              let len = high.len();
              let mut output = init_output(len);

              for i in 0..len {
                  if !max[i].is_nan() && !min[i].is_nan() {
                      output[i] = (max[i] + min[i]) / 2.0;
                  }
              }

              Ok(output)'''
          new_midprice = '''    let mut output = init_output(high.len());
              rolling_minmax_visit(high, low, period, |i, highest, lowest| {
                  output[i] = (highest + lowest) * 0.5;
              });
              Ok(output)'''
          if old_midprice in text:
              text = text.replace(old_midprice, new_midprice, 1)
          elif "rolling_minmax_visit(high, low, period" not in text:
              raise SystemExit("midprice anchor missing")
          overlap.write_text(text, encoding="utf-8")

          momentum = Path("core/src/indicators/momentum.rs")
          text = momentum.read_text(encoding="utf-8")
          import_anchor = "use crate::math::simd_ops;\n"
          if "use crate::math::statistics::rolling_minmax_visit;" not in text:
              if import_anchor not in text:
                  raise SystemExit("momentum import anchor missing")
              text = text.replace(
                  import_anchor,
                  import_anchor + "use crate::math::statistics::rolling_minmax_visit;\n",
                  1,
              )
          start = text.index("pub fn willr(high: &[f64], low: &[f64], close: &[f64], period: usize) -> Result<Array1<f64>> {")
          end_marker = "\n}\n\n/// Elder-Ray Indicator Result"
          end = text.index(end_marker, start)
          old_fn = text[start:end + 2]
          new_fn = '''pub fn willr(high: &[f64], low: &[f64], close: &[f64], period: usize) -> Result<Array1<f64>> {
              if high.len() != low.len() || high.len() != close.len() {
                  return Err(TaError::InvalidParameter {
                      name: "high, low, close".to_string(),
                      constraint: "must have the same length".to_string(),
                  });
              }
              validate_input(high.len(), period)?;

              let mut output = init_output(close.len());
              rolling_minmax_visit(high, low, period, |i, highest, lowest| {
                  let range = highest - lowest;
                  output[i] = if range > 1e-15 {
                      (highest - close[i]) / range * -100.0
                  } else {
                      0.0
                  };
              });
              Ok(output)
          }'''
          if "rolling_minmax_visit(high, low, period, |i, highest, lowest|" not in old_fn:
              text = text[:start] + new_fn + text[end + 2:]
          momentum.write_text(text, encoding="utf-8")
          PY

      - name: Regenerate NumPy-direct Python SSOT binding
        run: |
          python scripts/sync_bindings.py --lang python --generate
          python scripts/sync_bindings.py --lang python --check
          python scripts/optimize_python_bindings.py --check ffi/python-binding/src/generated.rs

      - name: Format and validate
        run: |
          cargo fmt --all -- --check || cargo fmt --all
          cargo test -p finkit --lib
          cargo check -p finkit-python
          python scripts/sync_bindings.py --lang python --check
          python scripts/optimize_python_bindings.py --check ffi/python-binding/src/generated.rs

      - name: Commit validated upgrade and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/arch-v3-hotpath-upgrade-once.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add core/src/math/statistics.rs core/src/indicators/overlap.rs core/src/indicators/momentum.rs ffi/python-binding/src/formula_plan.rs ffi/python-binding/src/generated.rs scripts/sync_bindings.py .github/workflows/arch-v3-hotpath-upgrade-once.yml
          if git diff --cached --quiet; then
            echo "No validated changes to commit"
            exit 0
          fi
          git commit -m "perf(v3): fuse rolling extrema and canonicalize hot formula kernels"
          git push origin HEAD:perf/outperform-talib-v3-20260904
