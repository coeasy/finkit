name: Research multilingual integrate 2

on:
  push:
    branches:
      - feat/factor-research-architecture

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/factor-research-architecture
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply factor-research multilingual bridges
        run: python scripts/research_multilang_integrate.py
      - name: Apply generic quant-evaluation multilingual bridges
        run: python scripts/research_quant_eval_integrate.py
      - name: Normalize current semantic-fixup anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/research_eval_fixups.py')
          text = path.read_text()

          helper_old = """    if new in text:\n        return\n"""
          helper_new = """    if new and new in text:\n        return\n"""
          if helper_old not in text and helper_new not in text:
              raise SystemExit('expected semantic-fixup helper anchor not found')
          if helper_old in text:
              text = text.replace(helper_old, helper_new, 1)

          report_old = """    '''        assert_eq!(report.periods, vec![1]);\n        assert!(report.information.mean_ic[&1] > 0.9);''',\n    '''        assert_eq!(report.periods, vec![1]);\n        assert_eq!(report.execution_lag, 0);"""
          report_new = """    '''        assert_eq!(report.periods, vec![1, 2]);\n        assert!(report.information.mean_ic[&1] > 0.9);''',\n    '''        assert_eq!(report.periods, vec![1, 2]);\n        assert_eq!(report.execution_lag, 0);"""
          if report_old not in text and report_new not in text:
              raise SystemExit('expected report semantic-fixup anchor not found')
          if report_old in text:
              text = text.replace(report_old, report_new, 1)

          path.write_text(text)
          PY
      - name: Apply evaluation semantic fixups
        run: python scripts/research_eval_fixups.py
      - name: Normalize borrowed benchmark assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('factor-analysis/src/performance.rs')
          text = path.read_text()
          old = 'assert!(report.benchmark.unwrap().tracking_error >= 0.0);'
          new = 'assert!(report.benchmark.as_ref().unwrap().tracking_error >= 0.0);'
          if old not in text and new not in text:
              raise SystemExit('expected benchmark assertion anchor not found')
          if old in text:
              path.write_text(text.replace(old, new, 1))
          PY
      - name: Refresh deterministic lockfile
        run: cargo generate-lockfile
      - name: Format generated Rust
        run: cargo fmt --all
      - name: Verify format
        run: cargo fmt --all --check
      - name: Research and evaluation unit tests
        run: cargo test -p finkit-factor-analysis --locked
      - name: Core performance and backtest evaluation tests
        run: |
          cargo test -p finkit performance --locked
          cargo test -p finkit backtest_evaluation --locked
      - name: Workspace compile gate
        run: cargo check --workspace --all-targets --locked
      - name: Java source gate
        run: mvn -q -f ffi/java-binding/pom.xml -DskipTests package
      - name: Dotnet source gate
        run: dotnet build ffi/dotnet-binding/src/Finkit/Finkit.csproj
      - name: C and C++ research header syntax gate
        run: |
          cat > /tmp/finkit_research_c.c <<'EOF'
          #include "finkit_research.h"
          int main(void) { return 0; }
          EOF
          cc -std=c11 -Wall -Wextra -Werror -Iffi/c-binding/include -fsyntax-only /tmp/finkit_research_c.c
          cat > /tmp/finkit_research_cpp.cpp <<'EOF'
          #include "finkit_research.hpp"
          int main() { return 0; }
          EOF
          c++ -std=c++17 -Wall -Wextra -Werror -Iffi/c-binding/include -fsyntax-only /tmp/finkit_research_cpp.cpp
      - name: Python source registration gate
        run: |
          grep -q 'research_api::register_research_api' ffi/python-binding/src/lib.rs
          grep -q 'fn quant_evaluation_json' ffi/python-binding/src/research_api.rs
      - name: Node research export gate
        run: grep -q 'pub fn quant_evaluation_json' ffi/node-binding/src/lib.rs
      - name: Android research export gate
        run: grep -q 'quantEvaluationJson' ffi/android-binding/android/src/main/java/com/finkit/indicators/Finkit.java
      - name: Go source format gate
        run: |
          if command -v gofmt >/dev/null 2>&1; then
            gofmt -w ffi/go-binding/go/ta/research.go ffi/go-binding/go/ta/quant_evaluation.go
          fi
      - name: Swift source parse gate
        run: |
          if command -v swiftc >/dev/null 2>&1; then
            find ffi/ios-binding \( -name 'FactorResearch.swift' -o -name 'QuantEvaluation.swift' \) -print0 | xargs -0 -r swiftc -parse
          fi
      - name: Commit only after all gates pass
        run: |
          rm .github/workflows/research-integrate.yml
          rm .github/workflows/research-multilang-integrate.yml
          rm .github/workflows/research-multilang-integrate2.yml
          rm scripts/research_multilang_integrate.py
          rm scripts/research_quant_eval_integrate.py
          rm scripts/research_eval_fixups.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: integrate multilingual factor research and quant evaluation APIs"
          git push origin HEAD:feat/factor-research-architecture
