name: Architecture v3.1 converge once

on:
  push:
    branches:
      - perf/outperform-talib-v3-20260904

permissions:
  contents: write

concurrency:
  group: architecture-v31-converge-once
  cancel-in-progress: true

jobs:
  converge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/outperform-talib-v3-20260904
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Prepare Python FFI SSOT
        run: |
          python scripts/repair_python_new_indicator_bindings.py
          python scripts/prepare_python_registry_ssot.py
          python scripts/apply_architecture_v3_unified_kernel.py
          python scripts/sync_bindings.py --lang python --generate
          python scripts/optimize_python_bindings.py ffi/python-binding/src/lib.rs
          python scripts/apply_formula_v3_fast_path.py

      - name: Apply Architecture v3.1 convergence
        run: |
          python scripts/apply_architecture_v31_convergence.py
          python - <<'PY'
          from pathlib import Path

          path = Path('core/src/indicators/momentum.rs')
          text = path.read_text(encoding='utf-8')
          bad = '    macd_line[macd_start..signal_start].fill(f64::NAN);\n'
          good = '''    for index in macd_start..signal_start {
              macd_line[index] = f64::NAN;
          }
          '''
          if bad in text:
              text = text.replace(bad, good, 1)
          elif good.strip() not in text:
              raise SystemExit('MACD warm-up mask anchor missing')

          old_test = '''        let result = macd(&input, 12, 26, 9).unwrap();
                  assert!(!result.macd[25].is_nan());
          '''
          new_test = '''        let result = macd(&input, 12, 26, 9).unwrap();
                  // TA-Lib lookback is (slow - 1) + (signal - 1) = 33.
                  // All public MACD outputs share that warm-up boundary.
                  assert!(result.macd[32].is_nan());
                  assert!(result.signal[32].is_nan());
                  assert!(result.hist[32].is_nan());
                  assert!(!result.macd[33].is_nan());
                  assert!(!result.signal[33].is_nan());
                  assert!(!result.hist[33].is_nan());
          '''
          if old_test in text:
              text = text.replace(old_test, new_test, 1)
          elif 'assert!(result.macd[32].is_nan());' not in text:
              raise SystemExit('MACD core test contract anchor missing')
          path.write_text(text, encoding='utf-8')

          plan_path = Path('core/src/execution_plan.rs')
          plan_text = plan_path.read_text(encoding='utf-8')
          section_start = plan_text.index('impl InputLayout {')
          section_end = plan_text.index('/// Numeric layout of retained public outputs.', section_start)
          section = plan_text[section_start:section_end]

          if 'slots_by_operation' not in section:
              init_anchor = '        let mut slots = BTreeMap::new();\n'
              if init_anchor not in section:
                  raise SystemExit('InputLayout slots initialization anchor missing')
              section = section.replace(
                  init_anchor,
                  init_anchor + '        let mut slots_by_operation = BTreeMap::<&str, InputSlot>::new();\n',
                  1,
              )

              old_slot = '''            if node.operation.starts_with("VARIABLE:") {
                          let slot = InputSlot(slots.len());
                          slots.insert(node_id, slot);
                      }
          '''
              new_slot = '''            if node.operation.starts_with("VARIABLE:") {
                          let operation = node.operation.as_str();
                          let slot = if let Some(slot) = slots_by_operation.get(operation) {
                              *slot
                          } else {
                              let slot = InputSlot(slots_by_operation.len());
                              slots_by_operation.insert(operation, slot);
                              slot
                          };
                          slots.insert(node_id, slot);
                      }
          '''
              if old_slot not in section:
                  raise SystemExit('InputLayout slot allocation anchor missing')
              section = section.replace(old_slot, new_slot, 1)

          if '.map(|slot| slot.0 + 1)' not in section:
              old_len = '''    pub fn len(&self) -> usize {
                      self.slots.len()
                  }
          '''
              new_len = '''    pub fn len(&self) -> usize {
                      self.slots
                          .values()
                          .map(|slot| slot.0 + 1)
                          .max()
                          .unwrap_or(0)
                  }
          '''
              if old_len not in section:
                  raise SystemExit('InputLayout len anchor missing')
              section = section.replace(old_len, new_len, 1)

          plan_text = plan_text[:section_start] + section + plan_text[section_end:]
          if 'duplicate_external_variable_reads_share_one_numeric_input_slot' not in plan_text:
              test_anchor = '    #[test]\n    fn exact_parameters_are_numeric_and_prebound() {\n'
              regression = '''    #[test]
              fn duplicate_external_variable_reads_share_one_numeric_input_slot() {
                  let plan = ComputePlan::compile([
                      ComputeNode::new(
                          ComputeNodeId(0),
                          "VARIABLE:CLOSE",
                          vec![],
                          capabilities(false),
                      ),
                      ComputeNode::new(
                          ComputeNodeId(1),
                          "VARIABLE:CLOSE",
                          vec![],
                          capabilities(false),
                      ),
                      ComputeNode::new(
                          ComputeNodeId(2),
                          "BINARY:Add",
                          vec![ComputeNodeId(0), ComputeNodeId(1)],
                          capabilities(false),
                      ),
                  ])
                  .unwrap();

                  let hot = HotExecutionPlan::compile(&plan, [ComputeNodeId(2)]).unwrap();
                  assert_eq!(hot.input_layout().slot(ComputeNodeId(0)), Some(InputSlot(0)));
                  assert_eq!(hot.input_layout().slot(ComputeNodeId(1)), Some(InputSlot(0)));
                  assert_eq!(hot.input_layout().len(), 1);
                  assert_eq!(hot.metadata().inputs, 1);
              }

          '''
              if test_anchor not in plan_text:
                  raise SystemExit('InputLayout regression-test anchor missing')
              plan_text = plan_text.replace(test_anchor, regression + test_anchor, 1)
          plan_path.write_text(plan_text, encoding='utf-8')
          PY
          python scripts/sync_bindings.py --lang python --generate
          python scripts/optimize_python_bindings.py ffi/python-binding/src/lib.rs

      - name: Validate generated binding contract
        run: |
          python scripts/sync_bindings.py --lang python --check
          python scripts/optimize_python_bindings.py --check ffi/python-binding/src/generated.rs ffi/python-binding/src/lib.rs
          python - <<'PY'
          from pathlib import Path

          facade = Path('ffi/python-binding/finkit/__init__.py').read_text(encoding='utf-8')
          forbidden = (
              'np.asarray(_native.',
              'np.array(_native.',
              'np.asarray(function(',
              'np.array(function(',
          )
          found = [token for token in forbidden if token in facade]
          if found:
              raise SystemExit(
                  'native numeric output is still rematerialized through NumPy: '
                  + ', '.join(found)
              )
          print('Python public hot paths do not rematerialize native numeric outputs')
          PY

      - name: Format workspace
        run: cargo fmt --all

      - name: Core correctness
        id: core_correctness
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo test -p finkit --lib --locked 2>&1 | tee core-test.log

      - name: Upload core correctness failure log
        if: steps.core_correctness.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: architecture-v31-core-test-log
          path: core-test.log
          if-no-files-found: error
          retention-days: 3

      - name: Enforce core correctness
        if: steps.core_correctness.outcome == 'failure'
        run: exit 1

      - name: Compile Python ABI3 binding
        run: cargo check -p finkit-python --features abi3 --locked

      - name: Validate diff
        run: git diff --check

      - name: Commit validated Architecture v3.1 convergence
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if ! git diff --quiet -- core; then
            git add core
            git commit -m 'refactor(v3): converge canonical kernel semantics'
          fi

          git add -A ffi scripts registry 2>/dev/null || true
          git reset -- scripts/apply_architecture_v31_convergence.py
          if ! git diff --cached --quiet; then
            git commit -m 'perf(v3): generate ndarray-direct Python bindings'
          fi

          git rm .github/workflows/arch-v31-converge-once.yml scripts/apply_architecture_v31_convergence.py
          git commit -m 'chore(v3): remove convergence scaffolding'
          git push origin HEAD:perf/outperform-talib-v3-20260904
