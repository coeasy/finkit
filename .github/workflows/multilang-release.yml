name: Multilang release

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "core/**"
      - "ffi/c-binding/**"
      - "ffi/ffi-common/**"
      - "ffi/java-binding/**"
      - "ffi/node-binding/**"
      - "scripts/check_versions.py"
      - ".github/workflows/multilang-release.yml"
  push:
    branches: ["release/v*"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: multilang-release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RELEASE_VERSION: "0.1.3"

jobs:
  version-contract:
    name: Version contract
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify all published package versions
        run: python scripts/check_versions.py
      - name: Verify release version
        run: python -c "import re,pathlib; t=pathlib.Path('Cargo.toml').read_text(); v=re.search(r'\\[workspace.package\\][\\s\\S]*?version\\s*=\\s*\"([^\"]+)\"',t).group(1); assert v == '${{ env.RELEASE_VERSION }}', (v, '${{ env.RELEASE_VERSION }}')"

  node-native:
    name: Node ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-22.04
            npm_dir: linux-x64-gnu
          - platform: macos-x86_64
            os: macos-15-intel
            npm_dir: darwin-x64
          - platform: macos-aarch64
            os: macos-14
            npm_dir: darwin-arm64
          - platform: windows-x86_64
            os: windows-2022
            npm_dir: win32-x64-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ffi/node-binding/package-lock.json
      - name: Install Node build dependencies
        working-directory: ffi/node-binding
        run: npm ci
      - name: Build native module
        working-directory: ffi/node-binding
        run: npm run build
      - name: Run Node tests against native module
        working-directory: ffi/node-binding
        run: npm test
      - name: Stage napi platform artifact
        working-directory: ffi/node-binding
        run: npm run artifacts
      - name: Verify platform package payload
        working-directory: ffi/node-binding/npm/${{ matrix.npm_dir }}
        run: node -e "const fs=require('fs'); if(!fs.existsSync('finkit.node')) throw new Error('missing finkit.node')"
      - name: Pack platform npm package
        working-directory: ffi/node-binding/npm/${{ matrix.npm_dir }}
        run: node -e "require('fs').mkdirSync('dist',{recursive:true})" && npm pack --pack-destination dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-node-${{ matrix.platform }}
          path: ffi/node-binding/npm/${{ matrix.npm_dir }}/dist/*.tgz
          if-no-files-found: error

  node-root:
    name: Node root package
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pack root npm package
        working-directory: ffi/node-binding
        run: node -e "require('fs').mkdirSync('dist',{recursive:true})" && npm pack --pack-destination dist
      - name: Verify root package contents
        working-directory: ffi/node-binding
        run: tar -tzf dist/finkit-${{ env.RELEASE_VERSION }}.tgz | tee /tmp/npm-files.txt && ! grep -q 'package/src/' /tmp/npm-files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-node-root
          path: ffi/node-binding/dist/*.tgz
          if-no-files-found: error

  java-native:
    name: Java native ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-22.04
            lib: libfinkit_java.so
          - platform: macos-x86_64
            os: macos-15-intel
            lib: libfinkit_java.dylib
          - platform: macos-aarch64
            os: macos-14
            lib: libfinkit_java.dylib
          - platform: windows-x86_64
            os: windows-2022
            lib: finkit_java.dll
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build JNI library
        run: cargo build -p finkit-java --release --locked
      - name: Stage JNI library
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/java-native/${{ matrix.platform }}"
          cp "target/release/${{ matrix.lib }}" "dist/java-native/${{ matrix.platform }}/"
      - uses: actions/upload-artifact@v4
        with:
          name: java-native-${{ matrix.platform }}
          path: dist/java-native
          if-no-files-found: error

  java-package:
    name: Java universal JAR
    needs: java-native
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          pattern: java-native-*
          path: ffi/java-binding/natives
          merge-multiple: true
      - name: Build universal JNI JAR
        run: mvn -B -f ffi/java-binding/pom.xml -DskipTests package
      - name: Verify embedded native coverage
        run: |
          set -euo pipefail
          jar tf "ffi/java-binding/target/finkit-${RELEASE_VERSION}.jar" > /tmp/jar-files.txt
          grep -q 'natives/linux-x86_64/libfinkit_java.so' /tmp/jar-files.txt
          grep -q 'natives/macos-x86_64/libfinkit_java.dylib' /tmp/jar-files.txt
          grep -q 'natives/macos-aarch64/libfinkit_java.dylib' /tmp/jar-files.txt
          grep -q 'natives/windows-x86_64/finkit_java.dll' /tmp/jar-files.txt
      - name: Smoke test embedded Linux native loader
        run: |
          set -euo pipefail
          printf '%s\n' \
            'import com.finkit.Indicators;' \
            'public final class FinkitSmoke {' \
            '  public static void main(String[] args) {' \
            '    double[] out = Indicators.sma(new double[]{1,2,3,4,5}, 3);' \
            '    if (out.length != 5 || Math.abs(out[4] - 4.0) > 1e-9) throw new RuntimeException("bad SMA");' \
            '  }' \
            '}' > "$RUNNER_TEMP/FinkitSmoke.java"
          javac -cp "ffi/java-binding/target/finkit-${RELEASE_VERSION}.jar" "$RUNNER_TEMP/FinkitSmoke.java"
          java -cp "ffi/java-binding/target/finkit-${RELEASE_VERSION}.jar:$RUNNER_TEMP" FinkitSmoke
      - uses: actions/upload-artifact@v4
        with:
          name: release-java
          path: ffi/java-binding/target/finkit-*.jar
          if-no-files-found: error

  cpp-sdk:
    name: C/C++ SDK ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-22.04
          - platform: macos-x86_64
            os: macos-15-intel
          - platform: macos-aarch64
            os: macos-14
          - platform: windows-x86_64
            os: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build C ABI library
        run: cargo build -p finkit-ffi --release --locked
      - name: Add Windows runtime directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "$env:GITHUB_WORKSPACE\target\release" >> $env:GITHUB_PATH
      - name: Configure C/C++ SDK
        run: cmake -S ffi/c-binding -B build/cpp -DFINKIT_AUTO_BUILD_RS=OFF -DFINKIT_BUILD_TESTS=ON -DFINKIT_BUILD_EXAMPLES=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build C/C++ tests and examples
        run: cmake --build build/cpp --config Release --parallel 2
      - name: Run C/C++ tests
        run: ctest --test-dir build/cpp -C Release --output-on-failure
      - name: Install SDK layout
        run: cmake --install build/cpp --config Release --prefix dist/cpp/${{ matrix.platform }}
      - name: Verify CMake package version
        shell: bash
        run: grep -R "${RELEASE_VERSION}" "dist/cpp/${{ matrix.platform }}"/*/cmake/finkit/finkit-config-version.cmake "dist/cpp/${{ matrix.platform }}"/lib*/cmake/finkit/finkit-config-version.cmake 2>/dev/null | head -n 1
      - name: Archive SDK
        shell: bash
        run: tar -czf "finkit-cpp-${RELEASE_VERSION}-${{ matrix.platform }}.tar.gz" -C "dist/cpp/${{ matrix.platform }}" .
      - uses: actions/upload-artifact@v4
        with:
          name: release-cpp-${{ matrix.platform }}
          path: finkit-cpp-*.tar.gz
          if-no-files-found: error

  rust-package:
    name: Rust crate and CLI
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Package Rust crate
        run: cargo package -p finkit --locked --no-verify
      - name: Build CLI
        run: cargo build -p finkit-cli --release --locked
      - name: Stage Rust assets
        run: |
          set -euo pipefail
          mkdir -p dist/rust
          cp target/package/finkit-*.crate dist/rust/
          cp target/release/finkit-cli dist/rust/finkit-cli-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: release-rust
          path: dist/rust/*
          if-no-files-found: error

  release:
    name: Publish multi-language GitHub Release
    needs: [version-contract, node-native, node-root, java-package, cpp-sdk, rust-package]
    if: github.event_name == 'push' && startsWith(github.ref_name, 'release/v') && startsWith(github.event.head_commit.message, 'release: publish ')
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Reuse verified Python ABI3 wheels from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow python-wheels.yml --branch main --commit "$main_sha" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$run_id"
          mkdir -p python-wheels
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --pattern 'wheel-*' --dir python-wheels
          find python-wheels -type f -name '*.whl' -exec cp {} release-assets/ \;
          test "$(find release-assets -maxdepth 1 -name 'finkit-*.whl' | wc -l)" -eq 4
      - name: Validate release asset versions
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#release/}"
          test "$tag" = "v${RELEASE_VERSION}"
          python scripts/check_versions.py
          find release-assets -maxdepth 1 -type f -print | sort
          sha256sum release-assets/* > release-assets/SHA256SUMS
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#release/}"
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$main_sha" --title "Finkit $tag — Multi-language Release" --generate-notes
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber release-assets/*
