name: Multilang release

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "core/**"
      - "wasm/**"
      - "ffi/c-binding/**"
      - "ffi/ffi-common/**"
      - "ffi/java-binding/**"
      - "ffi/node-binding/**"
      - "ffi/go-binding/**"
      - "ffi/dotnet-binding/**"
      - "ffi/android-binding/**"
      - "ffi/ios-binding/**"
      - "scripts/check_versions.py"
      - ".github/workflows/multilang-release.yml"
  push:
    branches:
      - "release/v*"
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: multilang-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  version-contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/check_versions.py
      - id: version
        name: Read and validate workspace version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import pathlib,re; text=pathlib.Path("Cargo.toml").read_text(); print(re.search(r"(?ms)^\[workspace\.package\].*?^version\s*=\s*\"([^\"]+)\"", text).group(1))')"
          test -n "$VERSION"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "release tag $GITHUB_REF_NAME does not match workspace version v$VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Finkit version: $VERSION"

  node-linux:
    needs: version-contract
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ffi/node-binding/package-lock.json
      - working-directory: ffi/node-binding
        run: npm ci
      - working-directory: ffi/node-binding
        run: npm run build
      - working-directory: ffi/node-binding
        run: npm test
      - name: Stage Linux native npm package
        working-directory: ffi/node-binding
        shell: bash
        run: |
          set -euo pipefail
          test -f finkit.linux-x64-gnu.node
          cp finkit.linux-x64-gnu.node npm/linux-x64-gnu/finkit.node
          test -f npm/linux-x64-gnu/finkit.node
      - working-directory: ffi/node-binding/npm/linux-x64-gnu
        run: mkdir -p dist && npm pack --pack-destination dist
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: release-node-linux-x86_64
          path: ffi/node-binding/npm/linux-x64-gnu/dist/*.tgz
          if-no-files-found: error
      - working-directory: ffi/node-binding
        run: mkdir -p dist && npm pack --pack-destination dist
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: release-node-root
          path: ffi/node-binding/dist/*.tgz
          if-no-files-found: error

  java-linux:
    needs: version-contract
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: cargo build -p finkit-java --release --locked
      - run: mkdir -p ffi/java-binding/natives/linux-x86_64 && cp target/release/libfinkit_java.so ffi/java-binding/natives/linux-x86_64/
        shell: bash
      - run: mvn -B -f ffi/java-binding/pom.xml -DskipTests package
      - name: Verify, smoke-test and stage packaged JNI library
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.version-contract.outputs.version }}"
          JAR="ffi/java-binding/target/finkit-${VERSION}.jar"
          test -f "$JAR"
          jar tf "$JAR" | grep -q 'natives/linux-x86_64/libfinkit_java.so'
          printf '%s\n' 'import com.finkit.Indicators;' 'public final class FinkitSmoke { public static void main(String[] args) { double[] out = Indicators.sma(new double[]{1,2,3,4,5}, 3); if (out.length != 5 || Math.abs(out[4] - 4.0) > 1e-9) throw new RuntimeException("bad SMA"); } }' > "$RUNNER_TEMP/FinkitSmoke.java"
          javac -cp "$JAR" "$RUNNER_TEMP/FinkitSmoke.java"
          java -cp "$JAR:$RUNNER_TEMP" FinkitSmoke
          mkdir -p dist/java
          cp "$JAR" "dist/java/finkit-java-${VERSION}-linux-x86_64.jar"
      - uses: actions/upload-artifact@v7
        with:
          name: release-java-linux
          path: dist/java/*.jar
          if-no-files-found: error

  cpp-linux:
    needs: version-contract
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p finkit-ffi --release --locked
      - run: cmake -S ffi/c-binding -B build/cpp -DFINKIT_AUTO_BUILD_RS=OFF -DFINKIT_BUILD_TESTS=ON -DFINKIT_BUILD_EXAMPLES=ON -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/cpp --config Release --parallel 2
      - run: ctest --test-dir build/cpp -C Release --output-on-failure
      - run: cmake --install build/cpp --config Release --prefix dist/cpp/linux-x86_64
      - name: Verify and package C/C++ SDK
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.version-contract.outputs.version }}"
          grep -R "$VERSION" dist/cpp/linux-x86_64/lib*/cmake/finkit/finkit-config-version.cmake
          tar -czf "finkit-cpp-${VERSION}-linux-x86_64.tar.gz" -C dist/cpp/linux-x86_64 .
      - uses: actions/upload-artifact@v7
        with:
          name: release-cpp-linux-x86_64
          path: finkit-cpp-*.tar.gz
          if-no-files-found: error

  go-linux:
    needs: version-contract
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
          cache-dependency-path: ffi/go-binding/go/go.mod
      - run: cargo build -p finkit-go --release --locked
      - name: Test Go/CGO binding
        working-directory: ffi/go-binding/go
        env:
          CGO_ENABLED: "1"
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/release
        run: go test ./...
      - name: Build external Go example from checkout
        working-directory: ffi/go-binding
        env:
          CGO_ENABLED: "1"
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/release
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/finkit-go-example"
          cat > "$RUNNER_TEMP/finkit-go-example/go.mod" <<'EOF'
          module example.com/finkit-go-smoke

          go 1.23

          require github.com/coeasy/finkit/ffi/go-binding/go v0.0.0
          replace github.com/coeasy/finkit/ffi/go-binding/go => ${{ github.workspace }}/ffi/go-binding/go
          EOF
          cp examples/example.go "$RUNNER_TEMP/finkit-go-example/main.go"
          cd "$RUNNER_TEMP/finkit-go-example"
          go run .
      - name: Package and smoke-test standalone Go candidate
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.version-contract.outputs.version }}"
          ROOT="dist/go/finkit-go-${VERSION}-linux-x86_64"
          ARCHIVE="dist/go/finkit-go-${VERSION}-linux-x86_64.tar.gz"
          mkdir -p "$ROOT"
          cp -R ffi/go-binding/go "$ROOT/go"
          mkdir -p "$ROOT/go/native/linux-x86_64"
          cp target/release/libfinkit_go.so "$ROOT/go/native/linux-x86_64/"
          cp ffi/go-binding/README.md "$ROOT/README.md"
          tar -czf "$ARCHIVE" -C dist/go "finkit-go-${VERSION}-linux-x86_64"

          SMOKE_ROOT="$RUNNER_TEMP/finkit-go-package-smoke"
          rm -rf "$SMOKE_ROOT"
          mkdir -p "$SMOKE_ROOT"
          tar -xzf "$ARCHIVE" -C "$SMOKE_ROOT"
          PACKAGE_ROOT="$SMOKE_ROOT/finkit-go-${VERSION}-linux-x86_64"
          mkdir -p "$SMOKE_ROOT/app"
          cat > "$SMOKE_ROOT/app/go.mod" <<EOF
          module example.com/finkit-go-package-smoke

          go 1.23

          require github.com/coeasy/finkit/ffi/go-binding/go v0.0.0
          replace github.com/coeasy/finkit/ffi/go-binding/go => ${PACKAGE_ROOT}/go
          EOF
          cp ffi/go-binding/examples/example.go "$SMOKE_ROOT/app/main.go"
          cd "$SMOKE_ROOT/app"
          CGO_ENABLED=1 LD_LIBRARY_PATH="$PACKAGE_ROOT/go/native/linux-x86_64" go run .
      - uses: actions/upload-artifact@v7
        with:
          name: release-go-linux-x86_64
          path: dist/go/*.tar.gz
          if-no-files-found: error

  dotnet-linux:
    needs: version-contract
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - run: cargo build -p finkit-dotnet --release --locked
      - name: Stage Linux native asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ffi/dotnet-binding/native/linux-x64/native
          cp target/release/libfinkit_dotnet.so ffi/dotnet-binding/native/linux-x64/native/
      - name: Test managed binding with pinned .NET 8 SDK
        working-directory: ffi/dotnet-binding
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/release
        shell: bash
        run: |
          set -euo pipefail
          dotnet --version | grep -E '^8\.'
          dotnet test src/Finkit.Tests/Finkit.Tests.csproj -c Release --framework net8.0
      - name: Pack and inspect Linux NuGet candidate
        working-directory: ffi/dotnet-binding
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.version-contract.outputs.version }}"
          dotnet --version | grep -E '^8\.'
          dotnet pack src/Finkit/Finkit.csproj -c Release
          NUPKG="src/Finkit/bin/Release/Finkit.${VERSION}.nupkg"
          test -f "$NUPKG"
          unzip -l "$NUPKG" | grep -q 'runtimes/linux-x64/native/libfinkit_dotnet.so'
          mkdir -p ../../dist/dotnet
          cp "$NUPKG" "../../dist/dotnet/finkit-dotnet-${VERSION}-linux-x64.nupkg"
      - uses: actions/upload-artifact@v7
        with:
          name: release-dotnet-linux-x86_64
          path: dist/dotnet/*.nupkg
          if-no-files-found: error

  wasm32:
    needs: version-contract
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build -p finkit-wasm --target wasm32-unknown-unknown --release --locked
      - name: Stage WASM module
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.version-contract.outputs.version }}"
          mkdir -p dist/wasm
          cp target/wasm32-unknown-unknown/release/finkit_wasm.wasm "dist/wasm/finkit-wasm-${VERSION}.wasm"
          test -s "dist/wasm/finkit-wasm-${VERSION}.wasm"
      - uses: actions/upload-artifact@v7
        with:
          name: release-wasm32
          path: dist/wasm/finkit-wasm-*.wasm
          if-no-files-found: error

  android-aar:
    needs: version-contract
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK/NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build and verify Android native libraries
        shell: bash
        run: |
          set -euo pipefail
          cargo ndk --platform 24 \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86_64 \
            -t x86 \
            -o ffi/android-binding/android/src/main/jniLibs \
            build --release --locked -p finkit-android
          find ffi/android-binding/android/src/main/jniLibs -name 'libfinkit_android.so' -print
          test "$(find ffi/android-binding/android/src/main/jniLibs -name 'libfinkit_android.so' | wc -l)" -eq 4
          X86_LIB="ffi/android-binding/android/src/main/jniLibs/x86_64/libfinkit_android.so"
          nm -D --defined-only "$X86_LIB" | grep -q 'Java_com_finkit_indicators_Finkit_smaNative'
          nm -D --defined-only "$X86_LIB" | grep -q 'Java_com_finkit_indicators_Finkit_version'
          nm -D --defined-only "$X86_LIB" | grep -q 'finkit_android_abi_version'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"
      - name: Assemble Android AAR
        working-directory: ffi/android-binding/android
        run: gradle --no-daemon assembleRelease
      - name: Verify and stage AAR
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.version-contract.outputs.version }}"
          AAR="$(find ffi/android-binding/android/build/outputs/aar -name '*.aar' | head -1)"
          test -n "$AAR"
          unzip -l "$AAR" | grep -q 'jni/arm64-v8a/libfinkit_android.so'
          unzip -l "$AAR" | grep -q 'jni/armeabi-v7a/libfinkit_android.so'
          unzip -l "$AAR" | grep -q 'jni/x86_64/libfinkit_android.so'
          unzip -l "$AAR" | grep -q 'jni/x86/libfinkit_android.so'
          mkdir -p dist/android
          cp "$AAR" "dist/android/finkit-android-${VERSION}.aar"
      - uses: actions/upload-artifact@v7
        with:
          name: release-android-aar
          path: dist/android/*.aar
          if-no-files-found: error

  ios-xcframework:
    needs: version-contract
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - name: Build XCFramework
        run: bash ffi/ios-binding/build-xcframework.sh
      - name: Typecheck Swift wrapper against packaged C module
        shell: bash
        run: |
          set -euo pipefail
          HEADERS="$(find dist/ios/Finkit.xcframework -type d -name Headers | head -1)"
          test -n "$HEADERS"
          test -f "$HEADERS/module.modulemap"
          test -f "$HEADERS/finkit.h"
          xcrun swiftc -typecheck -I "$HEADERS" ffi/ios-binding/include/Finkit.swift
      - name: Package XCFramework
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.version-contract.outputs.version }}"
          test -d dist/ios/Finkit.xcframework
          ditto -c -k --sequesterRsrc --keepParent dist/ios/Finkit.xcframework "dist/ios/finkit-ios-${VERSION}.xcframework.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: release-ios-xcframework
          path: dist/ios/finkit-ios-*.xcframework.zip
          if-no-files-found: error

  rust-package:
    needs: version-contract
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo package -p finkit --locked --no-verify
      - run: cargo build -p finkit-cli --release --locked
      - run: mkdir -p dist/rust && cp target/package/finkit-*.crate dist/rust/ && cp target/release/finkit-cli dist/rust/finkit-cli-linux-x86_64
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: release-rust
          path: dist/rust/*
          if-no-files-found: error

  publish-release-assets:
    name: Publish multi-language release assets
    needs:
      - version-contract
      - node-linux
      - java-linux
      - cpp-linux
      - go-linux
      - dotnet-linux
      - wasm32
      - android-aar
      - ios-xcframework
      - rust-package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download all validated artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Keep only multi-language supplemental assets and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          rm -f release-assets/finkit-*.crate release-assets/finkit-cli-*
          find release-assets -maxdepth 1 -type f -print | sort
          test -n "$(find release-assets -maxdepth 1 -type f -print -quit)"
          (cd release-assets && sha256sum * > SHA256SUMS.multilang)
      - name: Create or update GitHub Release and upload supplemental assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="$GITHUB_REF_NAME"
          VERSION="${{ needs.version-contract.outputs.version }}"
          test "$RELEASE_TAG" = "v$VERSION"
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes || gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          fi
          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            release-assets/*
