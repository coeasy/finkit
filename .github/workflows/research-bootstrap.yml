name: Research bootstrap

on:
  push:
    branches:
      - feat/factor-research-architecture

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/factor-research-architecture
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Refresh lock minimally and compile research crate
        run: cargo check -p finkit-factor-analysis
      - name: Format workspace
        run: cargo fmt --all
      - name: Commit generated lockfile and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock Cargo.toml core factor-analysis
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: sync research lockfile and formatting"
          git push origin HEAD:feat/factor-research-architecture
