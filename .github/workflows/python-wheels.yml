name: Python wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "core/**"
      - "ffi/ffi-common/**"
      - "ffi/python-binding/**"
      - "visualization/**"
      - ".github/workflows/python-wheels.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional vX.Y.Z release tag to create or update"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: python-wheels-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PYTHONUNBUFFERED: "1"

jobs:
  # Build jobs are independent so a runner preflight cannot skip the matrix.
  build:
    name: ABI3 ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        platform:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            manylinux: "2_17"
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: "off"
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            manylinux: "off"
          - name: windows-x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            manylinux: "off"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up build Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build ABI3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          maturin-version: v1.11.5
          working-directory: ffi/python-binding
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          sccache: true
          args: >-
            --release --locked --out dist --compatibility pypi
            ${{ runner.os == 'Linux' && '--interpreter python3.12' || '--interpreter python' }}

      - name: Install wheel and test outside the source tree
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path

          dist = Path(os.environ["GITHUB_WORKSPACE"]) / "ffi/python-binding/dist"
          wheels = sorted(dist.glob("finkit-*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected exactly one wheel, found: {wheels}")
          subprocess.check_call([
              sys.executable,
              "-m",
              "pip",
              "install",
              "--force-reinstall",
              "--no-cache-dir",
              str(wheels[0]),
              "pytest",
          ])
          PY
          cd "$RUNNER_TEMP"
          python -m pytest "$GITHUB_WORKSPACE/ffi/python-binding/tests" -q

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.platform.name }}
          path: ffi/python-binding/dist/*.whl
          if-no-files-found: error

  compatibility:
    name: Python ${{ matrix.python }} compatibility
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Download Linux ABI3 wheel
        uses: actions/download-artifact@v8
        with:
          name: wheel-linux-x86_64
          path: dist

      - name: Install and test ABI3 wheel
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install --force-reinstall --no-cache-dir dist/finkit-*.whl pytest
          cd "$RUNNER_TEMP"
          python -m pytest "$GITHUB_WORKSPACE/ffi/python-binding/tests" -q

  validate:
    name: Validate wheel set
    needs: [build, compatibility]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up validation Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download wheel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Check release versions
        run: python scripts/check_versions.py

      - name: Validate wheel metadata and coverage
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input twine
          python -m twine check dist/*.whl
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          from packaging.utils import parse_wheel_filename

          pyproject = tomllib.loads(
              Path("ffi/python-binding/pyproject.toml").read_text()
          )
          expected_version = pyproject["project"]["version"]
          release_tag = os.environ.get("RELEASE_TAG", "")
          if release_tag and release_tag.removeprefix("v") != expected_version:
              raise SystemExit(
                  f"release tag {release_tag!r} does not match "
                  f"project version {expected_version!r}"
              )

          wheels = sorted(Path("dist").glob("finkit-*.whl"))
          if len(wheels) != 4:
              raise SystemExit(f"expected 4 ABI3 wheels, found {len(wheels)}")

          required_platforms = {
              "manylinux_2_17_x86_64": False,
              "macosx_x86_64": False,
              "macosx_arm64": False,
              "win_amd64": False,
          }
          has_cp38_abi3 = False

          for wheel in wheels:
              name, version, _, tags = parse_wheel_filename(wheel.name)
              if name != "finkit" or str(version) != expected_version:
                  raise SystemExit(
                      f"unexpected wheel metadata in {wheel.name}: "
                      f"name={name!r}, version={version!r}"
                  )
              if not tags:
                  raise SystemExit(f"wheel has no compatibility tags: {wheel.name}")
              for tag in tags:
                  has_cp38_abi3 |= (
                      tag.interpreter == "cp38" and tag.abi == "abi3"
                  )
                  if tag.platform == "manylinux_2_17_x86_64":
                      required_platforms["manylinux_2_17_x86_64"] = True
                  if tag.platform.startswith("macosx_") and tag.platform.endswith("_x86_64"):
                      required_platforms["macosx_x86_64"] = True
                  if tag.platform.startswith("macosx_") and tag.platform.endswith("_arm64"):
                      required_platforms["macosx_arm64"] = True
                  if tag.platform == "win_amd64":
                      required_platforms["win_amd64"] = True

          if not has_cp38_abi3:
              raise SystemExit("wheel set is missing the cp38-abi3 compatibility tag")
          missing = [name for name, present in required_platforms.items() if not present]
          if missing:
              raise SystemExit(f"missing platform coverage: {missing}")
          print(f"validated {len(wheels)} ABI3 finkit {expected_version} wheels")
          PY

  release:
    name: Publish release assets
    needs: validate
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Download wheel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Build crate and CLI assets
        shell: bash
        run: |
          set -euo pipefail
          cargo package -p finkit --locked --no-verify
          cp target/package/finkit-*.crate dist/
          cargo build -p finkit-cli --release --locked
          cp target/release/finkit-cli dist/finkit-cli-linux-x86_64
          sha256sum dist/* > dist/SHA256SUMS
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            release_tag="$RELEASE_TAG_INPUT"
          fi
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $release_tag" >&2
            exit 1
          fi
          if ! gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              gh release create "$release_tag" \
                --repo "$GITHUB_REPOSITORY" \
                --verify-tag \
                --title "$release_tag" \
                --generate-notes
            else
              gh release create "$release_tag" \
                --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" \
                --title "$release_tag" \
                --generate-notes
            fi
          fi
          gh release upload "$release_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            dist/*
