name: Research integrate

on:
  push:
    branches:
      - feat/factor-research-architecture

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/factor-research-architecture
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply reuse-first integration patches
        shell: python
        run: |
          from pathlib import Path
          import re

          def insert_once(path, needle, addition):
              p = Path(path)
              text = p.read_text()
              if addition.strip() in text:
                  return
              if needle not in text:
                  raise SystemExit(f"needle not found in {path}: {needle!r}")
              p.write_text(text.replace(needle, needle + addition, 1))

          def replace_regex(path, pattern, replacement):
              p = Path(path)
              text = p.read_text()
              new, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"expected one regex replacement in {path}, got {count}: {pattern}")
              p.write_text(new)

          insert_once(
              "ffi/python-binding/Cargo.toml",
              'finkit = { path = "../../core", default-features = false, features = ["std", "serde", "indicators-all"] }\n',
              'finkit-factor-analysis = { path = "../../factor-analysis" }\n',
          )
          insert_once(
              "cli/Cargo.toml",
              'finkit = { path = "../core", features = ["formula"] }\n',
              'finkit-factor-analysis = { path = "../factor-analysis" }\n',
          )

          features_path = Path("ffi/python-binding/src/features.rs")
          features_text = features_path.read_text()
          import_line = "use finkit_factor_analysis::{AssetId, FactorStudy, GroupId, PanelIndex, QuantizeConfig, ResearchFrame};\n"
          if import_line not in features_text:
              features_text = features_text.replace("use finkit::indicators;\n", "use finkit::indicators;\n" + import_line, 1)

          marker = "/// Register the features submodule.\n"
          function = r'''/// Run a complete panel-aware factor study and return its serializable JSON report.
          ///
          /// Rows must be sorted by `(timestamp, asset)` or at least grouped by ascending timestamp.
          /// `groups` is optional and enables date-local group quantization.
          #[pyfunction]
          #[pyo3(signature = (timestamps, assets, factor, prices, periods, quantiles=5, groups=None))]
          fn factor_study_json(
              py: Python<'_>,
              timestamps: PyReadonlyArray1<'_, i64>,
              assets: PyReadonlyArray1<'_, u32>,
              factor: PyReadonlyArray1<'_, f64>,
              prices: PyReadonlyArray1<'_, f64>,
              periods: Vec<usize>,
              quantiles: u16,
              groups: Option<PyReadonlyArray1<'_, u32>>,
          ) -> PyResult<String> {
              let timestamps = timestamps
                  .as_slice()
                  .map_err(|e| PyErr::new::<pyo3::exceptions::PyValueError, _>(format!("{e}")))?
                  .to_vec();
              let assets: Vec<AssetId> = assets
                  .as_slice()
                  .map_err(|e| PyErr::new::<pyo3::exceptions::PyValueError, _>(format!("{e}")))?
                  .iter()
                  .copied()
                  .map(AssetId)
                  .collect();
              let factor = factor
                  .as_slice()
                  .map_err(|e| PyErr::new::<pyo3::exceptions::PyValueError, _>(format!("{e}")))?
                  .to_vec();
              let prices = prices
                  .as_slice()
                  .map_err(|e| PyErr::new::<pyo3::exceptions::PyValueError, _>(format!("{e}")))?
                  .to_vec();
              let groups: Option<Vec<GroupId>> = groups
                  .map(|values| {
                      values
                          .as_slice()
                          .map(|slice| slice.iter().copied().map(GroupId).collect())
                          .map_err(|e| PyErr::new::<pyo3::exceptions::PyValueError, _>(format!("{e}")))
                  })
                  .transpose()?;

              py.detach(|| -> Result<String, String> {
                  let index = PanelIndex::new(timestamps, assets).map_err(|e| e.to_string())?;
                  let mut frame = ResearchFrame::new(index);
                  frame
                      .add_numeric("factor", "factor", factor)
                      .map_err(|e| e.to_string())?;
                  frame
                      .add_numeric("price", "market", prices)
                      .map_err(|e| e.to_string())?;
                  if let Some(groups) = groups {
                      frame.add_group("group", groups).map_err(|e| e.to_string())?;
                  }
                  let by_group = frame.has_group("group").then(|| "group".to_string());
                  let report = FactorStudy::new(&frame, "factor", "price", periods)
                      .quantize_config(QuantizeConfig {
                          quantiles,
                          by_group,
                          zero_aware: false,
                      })
                      .full_report()
                      .map_err(|e| e.to_string())?;
                  report.to_json_pretty().map_err(|e| e.to_string())
              })
              .map_err(|e| PyErr::new::<pyo3::exceptions::PyValueError, _>(e))
          }

          '''
          if "fn factor_study_json(" not in features_text:
              if marker not in features_text:
                  raise SystemExit("features registration marker not found")
              features_text = features_text.replace(marker, function + marker, 1)
          registration = '    m.add_function(wrap_pyfunction!(factor_study_json, &m)?)?;\n'
          if registration not in features_text:
              features_text = features_text.replace("    parent.add_submodule(&m)?;\n", registration + "    parent.add_submodule(&m)?;\n", 1)
          features_path.write_text(features_text)

          # Migrate ML forward-return facades to the canonical returns kernel.
          labels = Path("core/src/features/labels.rs")
          text = labels.read_text()
          imports = "use crate::returns::{forward_return as core_forward_return, ReturnKind};\n"
          if imports not in text:
              text = text.replace("use super::BarrierLabel;\n", "use super::BarrierLabel;\n" + imports, 1)
          text = re.sub(
              r"pub fn forward_return\(close: &\[f64\], n: usize\) -> Array1<f64> \{.*?\n\}",
              '''pub fn forward_return(close: &[f64], n: usize) -> Array1<f64> {
              if n == 0 {
                  return Array1::from_iter(close.iter().map(|&value| {
                      if value.is_finite() && value > 0.0 { 0.0 } else { f64::NAN }
                  }));
              }
              Array1::from(
                  core_forward_return(close, n, ReturnKind::Log)
                      .unwrap_or_else(|_| vec![f64::NAN; close.len()]),
              )
          }''',
              text,
              count=1,
              flags=re.S,
          )
          text = re.sub(
              r"pub fn forward_return_arithmetic\(close: &\[f64\], n: usize\) -> Array1<f64> \{.*?\n\}",
              '''pub fn forward_return_arithmetic(close: &[f64], n: usize) -> Array1<f64> {
              if n == 0 {
                  return Array1::from_iter(close.iter().map(|&value| {
                      if value.is_finite() && value.abs() > 1e-15 { 0.0 } else { f64::NAN }
                  }));
              }
              Array1::from(
                  core_forward_return(close, n, ReturnKind::Arithmetic)
                      .unwrap_or_else(|_| vec![f64::NAN; close.len()]),
              )
          }''',
              text,
              count=1,
              flags=re.S,
          )
          labels.write_text(text)

          # Regime log returns remain legacy-zero-filled but reuse the canonical return kernel.
          regime = Path("core/src/features/regime.rs")
          text = regime.read_text()
          if "use crate::returns::{one_period_returns, ReturnKind};" not in text:
              text = text.replace(
                  "use crate::math::statistics::rolling_std_dev;\n",
                  "use crate::math::statistics::rolling_std_dev;\nuse crate::returns::{one_period_returns, ReturnKind};\n",
                  1,
              )
          text = re.sub(
              r"fn log_returns\(data: &\[f64\]\) -> Array1<f64> \{.*?\n\}",
              '''fn log_returns(data: &[f64]) -> Array1<f64> {
              let mut values = one_period_returns(data, ReturnKind::Log);
              for value in &mut values {
                  if !value.is_finite() { *value = 0.0; }
              }
              Array1::from(values)
          }''',
              text,
              count=1,
              flags=re.S,
          )
          regime.write_text(text)

          # Hurst regression slope delegates to the canonical regression family.
          rolling = Path("core/src/features/rolling_stats.rs")
          text = rolling.read_text()
          if "use crate::math::regression::simple_slope;" not in text:
              text = text.replace("use crate::error::{Result, TaError};\n", "use crate::error::{Result, TaError};\nuse crate::math::regression::simple_slope;\n", 1)
          text = re.sub(
              r"fn linear_regression_slope\(x: &\[f64\], y: &\[f64\]\) -> f64 \{.*?\n\}",
              '''fn linear_regression_slope(x: &[f64], y: &[f64]) -> f64 {
              simple_slope(y, x).unwrap_or(f64::NAN)
          }''',
              text,
              count=1,
              flags=re.S,
          )
          rolling.write_text(text)

          # Factor facades reuse canonical return/rank/regression kernels.
          factors = Path("core/src/factors.rs")
          text = factors.read_text()
          text = re.sub(
              r"pub fn time_series_return\(values: &\[f64\], period: usize\) -> FactorResult<Vec<f64>> \{.*?\n\}",
              '''pub fn time_series_return(values: &[f64], period: usize) -> FactorResult<Vec<f64>> {
              crate::returns::lagged_return(values, period, crate::returns::ReturnKind::Arithmetic)
                  .map_err(|error| FactorError::InvalidParameter(error.to_string()))
          }''',
              text,
              count=1,
              flags=re.S,
          )
          text = re.sub(
              r"pub fn percentile_rank\(values: &\[f64\]\) -> Vec<f64> \{.*?\n\}",
              '''pub fn percentile_rank(values: &[f64]) -> Vec<f64> {
              crate::math::rank::percentile_rank(values)
          }''',
              text,
              count=1,
              flags=re.S,
          )
          text = re.sub(
              r"pub fn neutralize\(values: &\[f64\], exposure: &\[f64\]\) -> FactorResult<Vec<f64>> \{.*?\n\}",
              '''pub fn neutralize(values: &[f64], exposure: &[f64]) -> FactorResult<Vec<f64>> {
              if values.len() != exposure.len() {
                  return Err(FactorError::LengthMismatch {
                      name: "exposure".to_string(),
                      expected: values.len(),
                      actual: exposure.len(),
                  });
              }
              crate::math::regression::residualize(values, &[exposure])
                  .map_err(|error| FactorError::Compute(error.to_string()))
          }''',
              text,
              count=1,
              flags=re.S,
          )
          factors.write_text(text)

          # Add a cheap canonical simple-slope helper without producing predictions/residuals.
          regression = Path("core/src/math/regression.rs")
          text = regression.read_text()
          slope_fn = '''
          /// Simple OLS slope without materializing residuals; used by rolling/statistical helpers.
          pub fn simple_slope(y: &[f64], x: &[f64]) -> Result<f64> {
              if y.len() != x.len() {
                  return Err(TaError::InvalidParameter {
                      name: "x, y".to_string(),
                      constraint: "must have the same length".to_string(),
                  });
              }
              let valid: Vec<(f64, f64)> = y
                  .iter()
                  .copied()
                  .zip(x.iter().copied())
                  .filter(|(yv, xv)| yv.is_finite() && xv.is_finite())
                  .collect();
              if valid.len() < 2 {
                  return Err(TaError::InsufficientData { length: valid.len(), required: 2 });
              }
              let n = valid.len() as f64;
              let sum_x = valid.iter().map(|(_, xv)| *xv).sum::<f64>();
              let sum_y = valid.iter().map(|(yv, _)| *yv).sum::<f64>();
              let sum_xy = valid.iter().map(|(yv, xv)| yv * xv).sum::<f64>();
              let sum_x2 = valid.iter().map(|(_, xv)| xv * xv).sum::<f64>();
              let denom = n * sum_x2 - sum_x * sum_x;
              if denom.abs() < 1e-15 {
                  return Err(TaError::ComputationError { message: "regression design is singular".to_string() });
              }
              Ok((n * sum_xy - sum_x * sum_y) / denom)
          }

          '''
          if "pub fn simple_slope(" not in text:
              text = text.replace("/// Simple OLS facade for one exposure.\n", slope_fn + "/// Simple OLS facade for one exposure.\n", 1)
          regression.write_text(text)

      - name: Refresh lockfile
        run: cargo generate-lockfile
      - name: Format workspace
        run: cargo fmt --all
      - name: Check research, Python and CLI surfaces
        run: |
          cargo check -p finkit-factor-analysis --locked
          cargo test -p finkit-factor-analysis --locked
          cargo check -p finkit-python --locked
          cargo check -p finkit-cli --all-targets --locked
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock cli ffi/python-binding core factor-analysis
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "refactor: integrate research across core Python and CLI"
          git push origin HEAD:feat/factor-research-architecture
